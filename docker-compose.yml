services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: staging-superapp-dev
    container_name: staging-superapp
    ports:
      - "8000:8000"
      - "5173:5173"
    volumes:
      - .:/var/www/html
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
    depends_on:
      - db
  
  db:
    image: postgres:15-alpine
    container_name: staging-superapp-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=superapp
      - POSTGRES_USER=superapp_user
      - POSTGRES_PASSWORD=secret
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
