apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cilupbah-redis-data
  namespace: cilupbah
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # PVC production saat ini statically provisioned 1Gi dan tidak dapat
      # di-resize melalui kubectl apply. Upgrade kapasitas dilakukan terpisah.
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cilupbah-redis
  namespace: cilupbah
spec:
  replicas: 1
  strategy:
    type: Recreate # penting: PVC-nya ReadWriteOnce, jangan rolling update
  selector:
    matchLabels:
      app: cilupbah-redis
  template:
    metadata:
      labels:
        app: cilupbah-redis
    spec:
      priorityClassName: cilupbah-platform-critical
      containers:
        - name: redis
          image: redis:7-alpine
          # Redis ini menyimpan queue dan metadata Horizon. Queue tidak boleh dievict.
          # Keep 1 GiB below the cgroup limit for allocator and AOF rewrite
          # copy-on-write overhead. Queue data is never silently evicted.
          command:
            - redis-server
            - --maxmemory
            - "3gb"
            - --maxmemory-policy
            - noeviction
            - --appendonly
            - "yes"
            - --appendfsync
            - everysec
            - --auto-aof-rewrite-percentage
            - "100"
            - --auto-aof-rewrite-min-size
            - 64mb
            - --activedefrag
            - "yes"
            - --dir
            - /data
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              memory: "1Gi"
              cpu: "100m"
            limits:
              memory: "4Gi"
              cpu: "500m"
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: cilupbah-redis-data
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: cilupbah
spec:
  selector:
    app: cilupbah-redis
  ports:
    - port: 6379
      targetPort: 6379
