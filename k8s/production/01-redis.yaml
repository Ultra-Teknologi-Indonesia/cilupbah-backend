apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cilupbah-redis-data
  namespace: cilupbah
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cilupbah-redis
  namespace: cilupbah
spec:
  replicas: 1
  strategy:
    type: Recreate # penting: PVC-nya ReadWriteOnce, jangan rolling update
  selector:
    matchLabels:
      app: cilupbah-redis
  template:
    metadata:
      labels:
        app: cilupbah-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: cilupbah-redis-data
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: cilupbah
spec:
  selector:
    app: cilupbah-redis
  ports:
    - port: 6379
      targetPort: 6379
