apiVersion: apps/v1
kind: Deployment
metadata:
  name: cilupbah-horizon
  namespace: cilupbah
spec:
  replicas: 1
  # This instance owns only background supervisors. The critical profile is
  # deployed separately so catalog/export work cannot delay marketplace events.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cilupbah-horizon
  template:
    metadata:
      labels:
        app: cilupbah-horizon
    spec:
      imagePullSecrets:
        - name: ghcr-creds
      containers:
        - name: horizon
          image: ghcr.io/ultra-teknologi-indonesia/cilupbah:v1.0.0
          command: ["php", "artisan", "horizon"]
          resources:
            requests:
              memory: "2560Mi"
              cpu: "750m"
            limits:
              # Background supervisors have a bounded worker budget plus
              # Horizon/master overhead; this cap prevents fan-out growth.
              memory: "6Gi"
              # Keep CPU available for critical queues, API and Redis.
              cpu: "2500m"
          envFrom:
            - secretRef:
                name: cilupbah-env
          env:
            - name: REDIS_LONG_QUEUE_RETRY_AFTER
              value: "2160"
            - name: HORIZON_PROFILE
              value: "background"
            # Marketplace stock propagation is isolated from warehouse
            # critical work and starts conservatively to protect Redis/DB.
            - name: HORIZON_CHANNEL_STOCK_MAX_PROCESSES
              value: "1"
            - name: CHANNEL_SYNC_WINDOW_MINUTES
              value: "5"
            - name: LABEL_LOCAL_FIRST
              value: "true"
            - name: LABEL_PRINT_SPOOL_ROOT
              value: "/var/www/html/storage/app/print-spool"
          livenessProbe:
            exec:
              command: ["sh", "-c", "php artisan horizon:status | grep -q running"]
            initialDelaySeconds: 60
            periodSeconds: 60
            timeoutSeconds: 15
            failureThreshold: 3
