apiVersion: apps/v1
kind: Deployment
metadata:
  name: cilupbah-horizon
  namespace: cilupbah
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cilupbah-horizon
  template:
    metadata:
      labels:
        app: cilupbah-horizon
    spec:
      imagePullSecrets:
        - name: ghcr-creds
      containers:
        - name: horizon
          image: ghcr.io/ultra-teknologi-indonesia/cilupbah:v1.0.0
          command: ["php", "artisan", "horizon"]
          resources:
            requests:
              memory: "1536Mi"
              cpu: "300m"
            limits:
              memory: "4096Mi"
              cpu: "2000m"
          envFrom:
            - secretRef:
                name: cilupbah-env
          livenessProbe:
            exec:
              command: ["sh", "-c", "php artisan horizon:status | grep -q running"]
            initialDelaySeconds: 60
            periodSeconds: 60
            timeoutSeconds: 15
            failureThreshold: 3
