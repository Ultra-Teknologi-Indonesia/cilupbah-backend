apiVersion: apps/v1
kind: Deployment
metadata:
  name: cilupbah-horizon
  namespace: cilupbah
spec:
  replicas: 1
  # Never run two Horizon masters during a rollout: duplicate workers consume
  # memory and can process the same operational backlog concurrently.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cilupbah-horizon
  template:
    metadata:
      labels:
        app: cilupbah-horizon
    spec:
      imagePullSecrets:
        - name: ghcr-creds
      containers:
        - name: horizon
          image: ghcr.io/ultra-teknologi-indonesia/cilupbah:v1.0.0
          command: ["php", "artisan", "horizon"]
          resources:
            requests:
              memory: "4Gi"
              cpu: "1000m"
            limits:
              # Order and webhook supervisors can autoscale to two bounded
              # workers per channel. Keep a full 20% memory headroom for the
              # Horizon master, PHP/Redis clients, and transient payloads.
              memory: "9Gi"
              # The node exposes 8 vCPU. A 4-core cap leaves room for the app,
              # database, Redis, and host scheduling during burst traffic.
              cpu: "4000m"
          envFrom:
            - secretRef:
                name: cilupbah-env
          env:
            - name: REDIS_LONG_QUEUE_RETRY_AFTER
              value: "2160"
          livenessProbe:
            exec:
              command: ["sh", "-c", "php artisan horizon:status | grep -q running"]
            initialDelaySeconds: 60
            periodSeconds: 60
            timeoutSeconds: 15
            failureThreshold: 3
