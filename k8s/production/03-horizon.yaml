apiVersion: apps/v1
kind: Deployment
metadata:
  name: cilupbah-horizon
  namespace: cilupbah
spec:
  replicas: 1
  minReadySeconds: 10
  # This instance owns only non-operational background supervisors. Every
  # marketplace-critical capability has its own Deployment.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: cilupbah-horizon
  template:
    metadata:
      labels:
        app: cilupbah-horizon
    spec:
      priorityClassName: cilupbah-batch
      # Background jobs can run for several minutes. KEDA may scale this
      # deployment to zero, but a pod must drain gracefully before termination.
      terminationGracePeriodSeconds: 360
      imagePullSecrets:
        - name: ghcr-creds
      initContainers:
        - name: wait-for-redis
          image: ghcr.io/ultra-teknologi-indonesia/cilupbah:v1.0.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: cilupbah-env
          command: ["sh", "-c"]
          args:
            - >-
              set -eu;
              until php -r '$host=getenv("REDIS_HOST") ?: "redis";
              $port=(int) (getenv("REDIS_PORT") ?: 6379);
              $socket=@fsockopen($host,$port,$errno,$errstr,2);
              if (!$socket) exit(1); fclose($socket);';
              do echo "Waiting for Redis"; sleep 2; done
      containers:
        - name: horizon
          image: ghcr.io/ultra-teknologi-indonesia/cilupbah:v1.0.0
          command: ["php", "artisan", "horizon"]
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              # Non-operational work must remain bounded so it cannot take
              # capacity reserved for order, fulfillment, AWB, and stock.
              memory: "2Gi"
              # Keep CPU available for operational queues, API and Redis.
              cpu: "2500m"
          envFrom:
            - secretRef:
                name: cilupbah-env
          env:
            - name: REDIS_LONG_QUEUE_RETRY_AFTER
              value: "2160"
            - name: REDIS_QUEUE_RETRY_AFTER
              value: "660"
            - name: REDIS_QUEUE_CONNECTION
              value: "horizon"
            - name: HORIZON_PROFILE
              value: "background"
            - name: CHANNEL_SYNC_WINDOW_MINUTES
              value: "5"
            - name: LABEL_LOCAL_FIRST
              value: "true"
            - name: LABEL_PRINT_SPOOL_ROOT
              value: "/var/www/html/storage/app/print-spool"
          startupProbe:
            exec:
              command: ["sh", "-c", "php artisan horizon:status | grep -q running"]
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 30
          livenessProbe:
            exec:
              command: ["sh", "-c", "php artisan horizon:status | grep -q running"]
            initialDelaySeconds: 60
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 5
