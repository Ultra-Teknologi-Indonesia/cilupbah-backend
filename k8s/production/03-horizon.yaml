apiVersion: apps/v1
kind: Deployment
metadata:
  name: cilupbah-horizon
  namespace: cilupbah
spec:
  replicas: 1
  # Never run two Horizon masters during a rollout: duplicate workers consume
  # memory and can process the same operational backlog concurrently.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cilupbah-horizon
  template:
    metadata:
      labels:
        app: cilupbah-horizon
    spec:
      imagePullSecrets:
        - name: ghcr-creds
      containers:
        - name: horizon
          image: ghcr.io/ultra-teknologi-indonesia/cilupbah:v1.0.0
          command: ["php", "artisan", "horizon"]
          resources:
            requests:
              memory: "4Gi"
              cpu: "500m"
            limits:
              # The worker plan is kept below 80% of this limit. The remaining
              # headroom absorbs peak PHP/Redis client memory without OOMKills.
              memory: "7Gi"
              cpu: "2000m"
          envFrom:
            - secretRef:
                name: cilupbah-env
          livenessProbe:
            exec:
              command: ["sh", "-c", "php artisan horizon:status | grep -q running"]
            initialDelaySeconds: 60
            periodSeconds: 60
            timeoutSeconds: 15
            failureThreshold: 3
