apiVersion: apps/v1
kind: Deployment
metadata:
  name: cilupbah-horizon
  namespace: cilupbah
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cilupbah-horizon
  template:
    metadata:
      labels:
        app: cilupbah-horizon
    spec:
      imagePullSecrets:
        - name: ghcr-creds
      containers:
        - name: horizon
          image: ghcr.io/ultra-teknologi-indonesia/cilupbah:v1.0.0
          command: ["php", "artisan", "horizon"]
          envFrom:
            - secretRef:
                name: cilupbah-env
