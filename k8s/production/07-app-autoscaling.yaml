apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cilupbah-app
  namespace: cilupbah
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cilupbah-app
  minReplicas: 3
  maxReplicas: 4
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      selectPolicy: Min
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cilupbah-app
  namespace: cilupbah
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: cilupbah-app
