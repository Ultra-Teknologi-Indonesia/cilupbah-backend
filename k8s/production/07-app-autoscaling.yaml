apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cilupbah-app
  namespace: cilupbah
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cilupbah-app
  minReplicas: 3
  # Six API pods still fit within the node request budget and leave room for
  # the warm operational pools. Beyond this point a second node is required;
  # pretending to scale further would increase OOM risk, not throughput.
  maxReplicas: 6
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      # Do not remove API capacity during a short lull between flash-sale
      # waves; wait five minutes and remove at most one pod per two minutes.
      stabilizationWindowSeconds: 300
      selectPolicy: Min
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cilupbah-app
  namespace: cilupbah
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: cilupbah-app
