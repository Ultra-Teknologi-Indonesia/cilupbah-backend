apiVersion: apps/v1
kind: Deployment
metadata:
  name: cilupbah-horizon-labels-awb
  namespace: cilupbah
spec:
  replicas: 1
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: cilupbah-horizon-labels-awb
  template:
    metadata:
      labels:
        app: cilupbah-horizon-labels-awb
    spec:
      priorityClassName: cilupbah-online-critical
      securityContext:
        fsGroup: 33
        fsGroupChangePolicy: OnRootMismatch
      imagePullSecrets:
        - name: ghcr-creds
      terminationGracePeriodSeconds: 180
      containers:
        - name: horizon-labels-awb
          image: ghcr.io/ultra-teknologi-indonesia/cilupbah:v1.0.0
          command: ["sh", "-c"]
          args: ["umask 0007 && exec php artisan horizon"]
          securityContext:
            runAsUser: 33
            runAsGroup: 33
            allowPrivilegeEscalation: false
          envFrom:
            - secretRef:
                name: cilupbah-env
          env:
            - name: HORIZON_PROFILE
              value: "labels-awb"
            - name: HORIZON_LABEL_AWB_REQUEST_MAX_PROCESSES
              value: "2"
            - name: HORIZON_LABEL_AWB_POLL_MAX_PROCESSES
              value: "1"
            - name: REDIS_LONG_QUEUE_RETRY_AFTER
              value: "2160"
          resources:
            requests:
              memory: "2Gi"
              cpu: "100m"
            limits:
              memory: "3Gi"
              cpu: "1500m"
          startupProbe:
            exec:
              command: ["sh", "-c", "php artisan horizon:status | grep -q running"]
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 30
          livenessProbe:
            exec:
              command: ["sh", "-c", "php artisan horizon:status | grep -q running"]
            initialDelaySeconds: 60
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 5
