apiVersion: apps/v1
kind: Deployment
metadata:
  name: cilupbah-horizon-critical
  namespace: cilupbah
  labels:
    app: cilupbah-horizon-critical
    component: queue-marketplace-ops
spec:
  replicas: 1
  minReadySeconds: 10
  revisionHistoryLimit: 2
  strategy:
    # Redis reservations prevent two workers from claiming the same ready job.
    # Keep one pod available while the replacement starts; jobs themselves
    # remain idempotent at the domain boundary.
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: cilupbah-horizon-critical
  template:
    metadata:
      labels:
        app: cilupbah-horizon-critical
        component: queue-marketplace-ops
    spec:
      priorityClassName: cilupbah-online-critical
      terminationGracePeriodSeconds: 180
      imagePullSecrets:
        - name: ghcr-creds
      containers:
        - name: horizon-critical
          image: ghcr.io/ultra-teknologi-indonesia/cilupbah:v1.0.0
          command: ["php", "artisan", "horizon"]
          envFrom:
            - secretRef:
                name: cilupbah-env
          env:
            - name: REDIS_LONG_QUEUE_RETRY_AFTER
              value: "2160"
            - name: REDIS_QUEUE_RETRY_AFTER
              value: "660"
            - name: REDIS_QUEUE_CONNECTION
              value: "horizon"
            - name: HORIZON_PROFILE
              value: "marketplace-ops"
            - name: HORIZON_MARKETPLACE_CONTROL_MAX_PROCESSES
              value: "4"
            - name: HORIZON_MARKETPLACE_WEBHOOK_MAX_PROCESSES
              value: "5"
          resources:
            requests:
              memory: "768Mi"
              cpu: "500m"
            limits:
              memory: "2560Mi"
              cpu: "2"
          startupProbe:
            exec:
              command: ["sh", "-c", "php artisan horizon:status | grep -q running"]
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 30
          livenessProbe:
            exec:
              command: ["sh", "-c", "php artisan horizon:status | grep -q running"]
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
