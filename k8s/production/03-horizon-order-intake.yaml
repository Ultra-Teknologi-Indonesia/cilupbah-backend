apiVersion: apps/v1
kind: Deployment
metadata:
  name: cilupbah-horizon-order-intake
  namespace: cilupbah
  labels:
    app: cilupbah-horizon-order-intake
    component: queue-order-intake
spec:
  replicas: 1
  minReadySeconds: 10
  revisionHistoryLimit: 2
  strategy:
    # Redis reservations keep pending jobs durable while the new master starts.
    # maxUnavailable=0 keeps order intake running during an image rollout.
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: cilupbah-horizon-order-intake
  template:
    metadata:
      labels:
        app: cilupbah-horizon-order-intake
        component: queue-order-intake
    spec:
      priorityClassName: cilupbah-online-critical
      terminationGracePeriodSeconds: 360
      imagePullSecrets:
        - name: ghcr-creds
      initContainers:
        - name: wait-for-redis
          image: ghcr.io/ultra-teknologi-indonesia/cilupbah:v1.0.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: cilupbah-env
          command: ["sh", "-c"]
          args:
            - >-
              set -eu;
              until php -r '$host=getenv("REDIS_HOST") ?: "redis";
              $port=(int) (getenv("REDIS_PORT") ?: 6379);
              $socket=@fsockopen($host,$port,$errno,$errstr,2);
              if (!$socket) exit(1); fclose($socket);';
              do echo "Waiting for Redis"; sleep 2; done
      containers:
        - name: horizon-order-intake
          image: ghcr.io/ultra-teknologi-indonesia/cilupbah:v1.0.0
          command: ["php", "artisan", "horizon"]
          envFrom:
            - secretRef:
                name: cilupbah-env
          env:
            - name: REDIS_QUEUE_CONNECTION
              value: "horizon"
            - name: REDIS_QUEUE_RETRY_AFTER
              value: "660"
            - name: HORIZON_PROFILE
              value: "order-intake"
            - name: HORIZON_ORDER_INTAKE_MAX_PROCESSES
              value: "6"
            - name: HORIZON_ORDER_SYNC_MAX_PROCESSES
              value: "4"
          resources:
            requests:
              memory: "768Mi"
              cpu: "500m"
            limits:
              memory: "2560Mi"
              cpu: "2"
          startupProbe:
            exec:
              command: ["sh", "-c", "php artisan horizon:status | grep -q running"]
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 30
          livenessProbe:
            exec:
              command: ["sh", "-c", "php artisan horizon:status | grep -q running"]
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
