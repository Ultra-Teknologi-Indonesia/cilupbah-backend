apiVersion: apps/v1
kind: Deployment
metadata:
  name: cilupbah-horizon-order-intake
  namespace: cilupbah
  labels:
    app: cilupbah-horizon-order-intake
    component: queue-order-intake
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    # A single Horizon master owns each queue. Pending Redis jobs remain
    # durable during this short handover and are safe to resume afterwards.
    type: Recreate
  selector:
    matchLabels:
      app: cilupbah-horizon-order-intake
  template:
    metadata:
      labels:
        app: cilupbah-horizon-order-intake
        component: queue-order-intake
    spec:
      priorityClassName: cilupbah-online-critical
      terminationGracePeriodSeconds: 180
      imagePullSecrets:
        - name: ghcr-creds
      containers:
        - name: horizon-order-intake
          image: ghcr.io/ultra-teknologi-indonesia/cilupbah:v1.0.0
          command: ["php", "artisan", "horizon"]
          envFrom:
            - secretRef:
                name: cilupbah-env
          env:
            - name: REDIS_QUEUE_CONNECTION
              value: "horizon"
            - name: REDIS_QUEUE_RETRY_AFTER
              value: "660"
            - name: HORIZON_PROFILE
              value: "order-intake"
            - name: HORIZON_ORDER_INTAKE_MAX_PROCESSES
              value: "6"
            - name: HORIZON_ORDER_SYNC_MAX_PROCESSES
              value: "4"
          resources:
            requests:
              memory: "768Mi"
              cpu: "500m"
            limits:
              memory: "2560Mi"
              cpu: "2"
          livenessProbe:
            exec:
              command: ["sh", "-c", "php artisan horizon:status | grep -q running"]
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["sh", "-c", "php artisan horizon:status | grep -q running"]
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 15
            failureThreshold: 3
