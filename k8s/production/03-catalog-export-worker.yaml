apiVersion: apps/v1
kind: Deployment
metadata:
  name: cilupbah-catalog-export-worker
  namespace: cilupbah
  labels:
    app: cilupbah-catalog-export-worker
spec:
  replicas: 2
  revisionHistoryLimit: 2
  progressDeadlineSeconds: 1200
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cilupbah-catalog-export-worker
  template:
    metadata:
      labels:
        app: cilupbah-catalog-export-worker
    spec:
      terminationGracePeriodSeconds: 720
      imagePullSecrets:
        - name: ghcr-creds
      containers:
        - name: catalog-export-worker
          image: ghcr.io/ultra-teknologi-indonesia/cilupbah:v1.0.0
          command:
            - sh
            - -c
            - |
              exec php artisan queue:work "${CATALOG_EXPORT_QUEUE_CONNECTION:-redis-long}" \
                --queue="${QUEUE_NAME_CATALOG_EXPORTS:-catalog-exports}" \
                --sleep=3 --tries=2 --backoff=10 --timeout=660 \
                --memory=512 --max-jobs=100 --max-time=600
          envFrom:
            - secretRef:
                name: cilupbah-env
          env:
            - name: REDIS_LONG_QUEUE_RETRY_AFTER
              value: "2160"
          livenessProbe:
            exec:
              command: ["sh", "-c", "kill -0 1"]
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["sh", "-c", "kill -0 1"]
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: "384Mi"
              cpu: "150m"
            limits:
              memory: "1536Mi"
              cpu: "1000m"
