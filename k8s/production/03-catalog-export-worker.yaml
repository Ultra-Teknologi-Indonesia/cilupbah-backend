apiVersion: apps/v1
kind: Deployment
metadata:
  name: cilupbah-catalog-export-worker
  namespace: cilupbah
  labels:
    app: cilupbah-catalog-export-worker
spec:
  replicas: 2
  revisionHistoryLimit: 2
  progressDeadlineSeconds: 1200
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: cilupbah-catalog-export-worker
  template:
    metadata:
      labels:
        app: cilupbah-catalog-export-worker
    spec:
      priorityClassName: cilupbah-batch
      terminationGracePeriodSeconds: 720
      imagePullSecrets:
        - name: ghcr-creds
      containers:
        - name: catalog-export-worker
          image: ghcr.io/ultra-teknologi-indonesia/cilupbah:v1.0.0
          command:
            - sh
            - -c
            - |
              exec /usr/local/bin/queue-worker.sh "${CATALOG_EXPORT_QUEUE_CONNECTION:-redis-long}" \
                --queue="${QUEUE_NAME_CATALOG_EXPORTS:-catalog-exports}" \
                --sleep=1 --tries=2 --backoff=10 --timeout=660 \
                --memory=512 --max-jobs=100 --max-time=600
          envFrom:
            - secretRef:
                name: cilupbah-env
          env:
            - name: REDIS_LONG_QUEUE_RETRY_AFTER
              value: "2160"
            - name: QUEUE_WORKER_STARTUP_JITTER_MAX_SECONDS
              value: "45"
          resources:
            requests:
              memory: "384Mi"
              cpu: "150m"
            limits:
              memory: "1536Mi"
              cpu: "1000m"
