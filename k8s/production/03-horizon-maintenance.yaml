apiVersion: apps/v1
kind: Deployment
metadata:
  name: cilupbah-horizon-maintenance
  namespace: cilupbah
  labels:
    app: cilupbah-horizon-maintenance
    component: queue-maintenance
spec:
  replicas: 1
  minReadySeconds: 10
  revisionHistoryLimit: 2
  # maintenance-heavy allows jobs up to 30 minutes; keep enough drain time
  # when KEDA scales the idle deployment back to zero.
  progressDeadlineSeconds: 2400
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: cilupbah-horizon-maintenance
  template:
    metadata:
      labels:
        app: cilupbah-horizon-maintenance
        component: queue-maintenance
    spec:
      priorityClassName: cilupbah-batch
      terminationGracePeriodSeconds: 1860
      imagePullSecrets:
        - name: ghcr-creds
      initContainers:
        - name: wait-for-redis
          image: ghcr.io/ultra-teknologi-indonesia/cilupbah:v1.0.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: cilupbah-env
          command: ["sh", "-c"]
          args:
            - >-
              set -eu;
              until php -r '$host=getenv("REDIS_HOST") ?: "redis";
              $port=(int) (getenv("REDIS_PORT") ?: 6379);
              $socket=@fsockopen($host,$port,$errno,$errstr,2);
              if (!$socket) exit(1); fclose($socket);';
              do echo "Waiting for Redis"; sleep 2; done
      containers:
        - name: horizon-maintenance
          image: ghcr.io/ultra-teknologi-indonesia/cilupbah:v1.0.0
          command: ["php", "artisan", "horizon"]
          envFrom:
            - secretRef:
                name: cilupbah-env
          env:
            - name: REDIS_LONG_QUEUE_RETRY_AFTER
              value: "2160"
            - name: HORIZON_PROFILE
              value: "maintenance"
          resources:
            requests:
              memory: "768Mi"
              cpu: "100m"
            limits:
              memory: "2Gi"
              cpu: "1"
          startupProbe:
            exec:
              command: ["sh", "-c", "php artisan horizon:status | grep -q running"]
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 30
          livenessProbe:
            exec:
              command: ["sh", "-c", "php artisan horizon:status | grep -q running"]
            initialDelaySeconds: 60
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 5
