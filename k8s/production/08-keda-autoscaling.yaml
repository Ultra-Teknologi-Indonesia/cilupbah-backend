apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: cilupbah-horizon-background
  namespace: cilupbah
  labels:
    app: cilupbah-horizon
    component: queue-autoscaling
spec:
  scaleTargetRef:
    name: cilupbah-horizon
  minReplicaCount: 1
  maxReplicaCount: 2
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          selectPolicy: Max
          policies:
            - type: Pods
              value: 1
              periodSeconds: 30
        scaleDown:
          stabilizationWindowSeconds: 300
          selectPolicy: Min
          policies:
            - type: Pods
              value: 1
              periodSeconds: 120
  triggers:
    - type: redis
      metadata:
        address: redis.cilupbah.svc.cluster.local:6379
        listName: cilupbah_superapp_horizon:queues:webhooks
        listLength: "25"
        activationListLength: "1"
    - type: redis
      metadata:
        address: redis.cilupbah.svc.cluster.local:6379
        listName: cilupbah_superapp_horizon:queues:default
        listLength: "25"
        activationListLength: "1"
    - type: redis
      metadata:
        address: redis.cilupbah.svc.cluster.local:6379
        listName: cilupbah_superapp_horizon:queues:notifications
        listLength: "25"
        activationListLength: "1"
    - type: redis
      metadata:
        address: redis.cilupbah.svc.cluster.local:6379
        listName: cilupbah-superapp-database-queues:channel-product
        listLength: "10"
        activationListLength: "1"
    - type: redis
      metadata:
        address: redis.cilupbah.svc.cluster.local:6379
        listName: cilupbah-superapp-database-queues:channel-after-sales
        listLength: "10"
        activationListLength: "1"
    - type: redis
      metadata:
        address: redis.cilupbah.svc.cluster.local:6379
        listName: cilupbah-superapp-database-queues:channel-finance
        listLength: "10"
        activationListLength: "1"
---
