apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: cilupbah-horizon-labels-awb
  namespace: cilupbah
spec:
  scaleTargetRef:
    name: cilupbah-horizon-labels-awb
  minReplicaCount: 1
  # AWB has independent request/poll lanes. A single replica is a hard
  # throughput ceiling during a flash burst; cap at three to keep the one-node
  # memory budget bounded while allowing KEDA to drain both lanes in parallel.
  maxReplicaCount: 3
  triggers:
    - type: redis
      metadata: {address: redis.cilupbah.svc.cluster.local:6379, listName: cilupbah-superapp-database-queues:label-awb, listLength: "20", activationListLength: "1"}
    - type: redis
      metadata: {address: redis.cilupbah.svc.cluster.local:6379, listName: cilupbah-superapp-database-queues:label-awb-request-shopee, listLength: "20", activationListLength: "1"}
    - type: redis
      metadata: {address: redis.cilupbah.svc.cluster.local:6379, listName: cilupbah-superapp-database-queues:label-awb-request-tiktok, listLength: "20", activationListLength: "1"}
    - type: redis
      metadata: {address: redis.cilupbah.svc.cluster.local:6379, listName: cilupbah-superapp-database-queues:label-awb-request-lazada, listLength: "20", activationListLength: "1"}
    - type: redis
      metadata: {address: redis.cilupbah.svc.cluster.local:6379, listName: cilupbah-superapp-database-queues:label-awb-poll-shopee, listLength: "20", activationListLength: "1"}
    - type: redis
      metadata: {address: redis.cilupbah.svc.cluster.local:6379, listName: cilupbah-superapp-database-queues:label-awb-poll-tiktok, listLength: "20", activationListLength: "1"}
    - type: redis
      metadata: {address: redis.cilupbah.svc.cluster.local:6379, listName: cilupbah-superapp-database-queues:label-awb-poll-lazada, listLength: "20", activationListLength: "1"}
---
