apiVersion: apps/v1
kind: Deployment
metadata:
  name: cilupbah-horizon-labels-prefetch
  namespace: cilupbah
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cilupbah-horizon-labels-prefetch
  template:
    metadata:
      labels:
        app: cilupbah-horizon-labels-prefetch
    spec:
      securityContext:
        fsGroup: 33
        fsGroupChangePolicy: OnRootMismatch
      imagePullSecrets:
        - name: ghcr-creds
      terminationGracePeriodSeconds: 180
      containers:
        - name: horizon-labels-prefetch
          image: ghcr.io/ultra-teknologi-indonesia/cilupbah:v1.0.0
          command: ["sh", "-c"]
          args: ["umask 0007 && exec php artisan horizon"]
          securityContext:
            runAsUser: 33
            runAsGroup: 33
            allowPrivilegeEscalation: false
          envFrom:
            - secretRef:
                name: cilupbah-env
          env:
            - name: HORIZON_PROFILE
              value: "labels-prefetch"
            - name: QUEUE_LABEL_PREFETCH_PARALLELISM
              value: "2"
            - name: REDIS_LONG_QUEUE_RETRY_AFTER
              value: "2160"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              memory: "1024Mi"
              cpu: "1000m"
          livenessProbe:
            exec:
              command: ["sh", "-c", "php artisan horizon:status | grep -q running"]
            initialDelaySeconds: 60
            periodSeconds: 60
            timeoutSeconds: 15
            failureThreshold: 3
