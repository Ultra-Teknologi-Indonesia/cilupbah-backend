apiVersion: apps/v1
kind: Deployment
metadata:
  name: cilupbah-horizon-fulfillment
  namespace: cilupbah
  labels:
    app: cilupbah-horizon-fulfillment
    component: queue-fulfillment
spec:
  replicas: 1
  minReadySeconds: 10
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: cilupbah-horizon-fulfillment
  template:
    metadata:
      labels:
        app: cilupbah-horizon-fulfillment
        component: queue-fulfillment
    spec:
      priorityClassName: cilupbah-online-critical
      terminationGracePeriodSeconds: 180
      imagePullSecrets:
        - name: ghcr-creds
      containers:
        - name: horizon-fulfillment
          image: ghcr.io/ultra-teknologi-indonesia/cilupbah:v1.0.0
          command: ["php", "artisan", "horizon"]
          envFrom:
            - secretRef:
                name: cilupbah-env
          env:
            - name: REDIS_QUEUE_CONNECTION
              value: "horizon"
            - name: REDIS_QUEUE_RETRY_AFTER
              value: "660"
            - name: HORIZON_PROFILE
              value: "fulfillment"
            - name: HORIZON_FULFILLMENT_MAX_PROCESSES
              value: "5"
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1536Mi"
              cpu: "2"
          startupProbe:
            exec:
              command: ["sh", "-c", "php artisan horizon:status | grep -q running"]
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 30
          livenessProbe:
            exec:
              command: ["sh", "-c", "php artisan horizon:status | grep -q running"]
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
