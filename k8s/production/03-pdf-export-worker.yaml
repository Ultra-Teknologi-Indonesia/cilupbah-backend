apiVersion: apps/v1
kind: Deployment
metadata:
  name: cilupbah-pdf-export-worker
  namespace: cilupbah
spec:
  replicas: 2
  revisionHistoryLimit: 2
  progressDeadlineSeconds: 1500
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: cilupbah-pdf-export-worker
  template:
    metadata:
      labels:
        app: cilupbah-pdf-export-worker
    spec:
      priorityClassName: cilupbah-batch
      imagePullSecrets:
        - name: ghcr-creds
      terminationGracePeriodSeconds: 1020
      containers:
        - name: pdf-export-worker
          image: ghcr.io/ultra-teknologi-indonesia/cilupbah:v1.0.0
          command:
            - sh
            - -c
            - |
              exec /usr/local/bin/queue-worker.sh redis-long \
                --queue=exports-pdf --sleep=1 --tries=3 --backoff=30 \
                --timeout=960 --memory=1536 --max-jobs=50 --max-time=900
          envFrom:
            - secretRef:
                name: cilupbah-env
          env:
            - name: REDIS_LONG_QUEUE_RETRY_AFTER
              value: "2160"
            - name: GOTENBERG_URL
              value: "http://cilupbah-gotenberg:3000"
            - name: QUEUE_WORKER_STARTUP_JITTER_MAX_SECONDS
              value: "45"
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "3Gi"
              cpu: "1500m"
