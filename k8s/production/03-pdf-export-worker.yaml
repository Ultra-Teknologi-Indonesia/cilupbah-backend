apiVersion: apps/v1
kind: Deployment
metadata:
  name: cilupbah-pdf-export-worker
  namespace: cilupbah
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cilupbah-pdf-export-worker
  template:
    metadata:
      labels:
        app: cilupbah-pdf-export-worker
    spec:
      imagePullSecrets:
        - name: ghcr-creds
      terminationGracePeriodSeconds: 960
      containers:
        - name: pdf-export-worker
          image: ghcr.io/ultra-teknologi-indonesia/cilupbah:v1.0.0
          command:
            - php
            - artisan
            - queue:work
            - redis-long
            - --queue=exports-pdf
            - --sleep=3
            - --tries=2
            - --backoff=30
            - --timeout=960
            - --memory=1536
            - --max-jobs=1
            - --max-time=900
          envFrom:
            - secretRef:
                name: cilupbah-env
          livenessProbe:
            exec:
              command: ["sh", "-c", "kill -0 1"]
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["sh", "-c", "kill -0 1"]
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1500m"
