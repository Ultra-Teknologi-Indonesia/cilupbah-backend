apiVersion: apps/v1
kind: Deployment
metadata:
  name: cilupbah-horizon-stock
  namespace: cilupbah
  labels:
    app: cilupbah-horizon-stock
    component: queue-stock
spec:
  replicas: 1
  minReadySeconds: 10
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: cilupbah-horizon-stock
  template:
    metadata:
      labels:
        app: cilupbah-horizon-stock
        component: queue-stock
    spec:
      priorityClassName: cilupbah-online-critical
      terminationGracePeriodSeconds: 180
      imagePullSecrets:
        - name: ghcr-creds
      containers:
        - name: horizon-stock
          image: ghcr.io/ultra-teknologi-indonesia/cilupbah:v1.0.0
          command: ["php", "artisan", "horizon"]
          envFrom:
            - secretRef:
                name: cilupbah-env
          env:
            - name: REDIS_QUEUE_CONNECTION
              value: "horizon"
            - name: REDIS_QUEUE_RETRY_AFTER
              value: "660"
            - name: HORIZON_PROFILE
              value: "stock"
            - name: HORIZON_STOCK_URGENT_MAX_PROCESSES
              value: "4"
            - name: HORIZON_STOCK_PROPAGATION_MAX_PROCESSES
              value: "3"
            - name: CHANNEL_STOCK_SYNC_DISPATCH_CLAIM_LIMIT
              value: "50"
            - name: CHANNEL_STOCK_SYNC_MAX_INFLIGHT_PER_SHOP
              value: "1"
          resources:
            requests:
              memory: "768Mi"
              cpu: "500m"
            limits:
              memory: "2560Mi"
              cpu: "2500m"
          startupProbe:
            exec:
              command: ["sh", "-c", "php artisan horizon:status | grep -q running"]
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 30
          livenessProbe:
            exec:
              command: ["sh", "-c", "php artisan horizon:status | grep -q running"]
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
