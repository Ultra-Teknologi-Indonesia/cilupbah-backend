apiVersion: apps/v1
kind: Deployment
metadata:
  name: cilupbah-horizon-stock
  namespace: cilupbah
  labels:
    app: cilupbah-horizon-stock
    component: queue-stock
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cilupbah-horizon-stock
  template:
    metadata:
      labels:
        app: cilupbah-horizon-stock
        component: queue-stock
    spec:
      terminationGracePeriodSeconds: 180
      imagePullSecrets:
        - name: ghcr-creds
      containers:
        - name: horizon-stock
          image: ghcr.io/ultra-teknologi-indonesia/cilupbah:v1.0.0
          command: ["php", "artisan", "horizon"]
          envFrom:
            - secretRef:
                name: cilupbah-env
          env:
            - name: REDIS_QUEUE_CONNECTION
              value: "horizon"
            - name: REDIS_QUEUE_RETRY_AFTER
              value: "660"
            - name: HORIZON_PROFILE
              value: "stock"
            # Stock is coalesced in the outbox; these are concurrency ceilings,
            # not a permission to send duplicate writes to a marketplace.
            - name: HORIZON_STOCK_MAX_PROCESSES
              value: "4"
            - name: HORIZON_CHANNEL_STOCK_MAX_PROCESSES
              value: "3"
            - name: HORIZON_CHANNEL_STOCK_CRITICAL_PROCESSES
              value: "2"
            - name: HORIZON_CHANNEL_STOCK_NORMAL_PROCESSES
              value: "2"
            - name: HORIZON_CHANNEL_STOCK_OUTBOX_PROCESSES
              value: "2"
            - name: CHANNEL_STOCK_SYNC_DISPATCH_CLAIM_LIMIT
              value: "50"
            - name: CHANNEL_STOCK_SYNC_MAX_INFLIGHT_PER_SHOP
              value: "1"
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "3Gi"
              cpu: "2500m"
          livenessProbe:
            exec:
              command: ["sh", "-c", "php artisan horizon:status | grep -q running"]
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["sh", "-c", "php artisan horizon:status | grep -q running"]
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 15
            failureThreshold: 3
