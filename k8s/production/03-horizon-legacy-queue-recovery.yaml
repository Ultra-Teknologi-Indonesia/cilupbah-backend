apiVersion: apps/v1
kind: Deployment
metadata:
  name: cilupbah-horizon-legacy-queue-recovery
  namespace: cilupbah
  labels:
    app: cilupbah-horizon-legacy-queue-recovery
    component: queue-recovery
spec:
  replicas: 1
  revisionHistoryLimit: 2
  # One dedicated Horizon master reads only the orphaned queues from the
  # pre-isolation Redis. It must be removed after recovery is verified.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cilupbah-horizon-legacy-queue-recovery
  template:
    metadata:
      labels:
        app: cilupbah-horizon-legacy-queue-recovery
        component: queue-recovery
    spec:
      terminationGracePeriodSeconds: 300
      imagePullSecrets:
        - name: ghcr-creds
      containers:
        - name: horizon-legacy-queue-recovery
          image: ghcr.io/ultra-teknologi-indonesia/cilupbah:v1.0.0
          command: ["php", "artisan", "horizon"]
          envFrom:
            - secretRef:
                name: cilupbah-env
          env:
            # The profile has three single-concurrency supervisors that drain
            # only the queues left in the pre-isolation Redis instance.
            - name: HORIZON_PROFILE
              value: "legacy-recovery"
            - name: REDIS_QUEUE_CONNECTION
              value: "horizon"
            - name: REDIS_QUEUE_RETRY_AFTER
              value: "660"
            - name: REDIS_LEGACY_QUEUE_CONNECTION
              value: "default"
            - name: REDIS_LEGACY_QUEUE_RETRY_AFTER
              value: "420"
          resources:
            requests:
              memory: "768Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          livenessProbe:
            exec:
              command: ["sh", "-c", "php artisan horizon:status | grep -q running"]
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 3
