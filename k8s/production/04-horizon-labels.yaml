apiVersion: apps/v1
kind: Deployment
metadata:
  name: cilupbah-horizon-labels
  namespace: cilupbah
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cilupbah-horizon-labels
  template:
    metadata:
      labels:
        app: cilupbah-horizon-labels
    spec:
      imagePullSecrets:
        - name: ghcr-creds
      terminationGracePeriodSeconds: 180
      containers:
        - name: horizon-labels
          image: ghcr.io/ultra-teknologi-indonesia/cilupbah:v1.0.0
          command: ["php", "artisan", "horizon"]
          envFrom:
            - secretRef:
                name: cilupbah-env
          env:
            - name: HORIZON_PROFILE
              value: "labels"
            - name: QUEUE_LABEL_PARALLELISM
              value: "6"
            - name: QUEUE_LABEL_AWB_PARALLELISM
              value: "2"
            - name: QUEUE_LABEL_ARCHIVE_PARALLELISM
              value: "2"
            - name: LABEL_LOCAL_FIRST
              value: "true"
            - name: LABEL_PRINT_SPOOL_ROOT
              value: "/var/www/html/storage/app/print-spool"
            - name: REDIS_LONG_QUEUE_RETRY_AFTER
              value: "2160"
          volumeMounts:
            - name: label-spool
              mountPath: /var/www/html/storage/app/print-spool
          resources:
            requests:
              memory: "2560Mi"
              cpu: "1500m"
            limits:
              memory: "6Gi"
              cpu: "3500m"
          livenessProbe:
            exec:
              command: ["sh", "-c", "php artisan horizon:status | grep -q running"]
            initialDelaySeconds: 60
            periodSeconds: 60
            timeoutSeconds: 15
            failureThreshold: 3
      volumes:
        - name: label-spool
          persistentVolumeClaim:
            claimName: cilupbah-label-spool
