apiVersion: apps/v1
kind: Deployment
metadata:
  name: cilupbah-horizon-labels
  namespace: cilupbah
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cilupbah-horizon-labels
  template:
    metadata:
      labels:
        app: cilupbah-horizon-labels
    spec:
      priorityClassName: cilupbah-online-support
      securityContext:
        fsGroup: 33
        fsGroupChangePolicy: OnRootMismatch
      imagePullSecrets:
        - name: ghcr-creds
      initContainers:
        - name: prepare-label-spool
          image: ghcr.io/ultra-teknologi-indonesia/cilupbah:v1.0.0
          command: ["sh", "-c"]
          args:
            - >-
              set -eu;
              mkdir -p /spool/items;
              chown root:33 /spool /spool/items;
              chmod 2770 /spool /spool/items;
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: label-spool
              mountPath: /spool
      terminationGracePeriodSeconds: 180
      containers:
        - name: horizon-labels
          image: ghcr.io/ultra-teknologi-indonesia/cilupbah:v1.0.0
          command: ["sh", "-c"]
          args: ["umask 0007 && exec php artisan horizon"]
          securityContext:
            runAsUser: 33
            runAsGroup: 33
            allowPrivilegeEscalation: false
          envFrom:
            - secretRef:
                name: cilupbah-env
          env:
            - name: HORIZON_PROFILE
              value: "labels-pdf"
            - name: HORIZON_LABEL_RENDER_MAX_PROCESSES
              value: "3"
            - name: HORIZON_LABEL_DOWNLOAD_MAX_PROCESSES
              value: "2"
            - name: LABEL_LOCAL_FIRST
              value: "true"
            - name: LABEL_PRINT_SPOOL_ROOT
              value: "/var/www/html/storage/app/print-spool"
            - name: REDIS_LONG_QUEUE_RETRY_AFTER
              value: "2160"
          volumeMounts:
            - name: label-spool
              mountPath: /var/www/html/storage/app/print-spool
          resources:
            requests:
              memory: "1536Mi"
              cpu: "500m"
            limits:
              memory: "5Gi"
              cpu: "2500m"
          livenessProbe:
            exec:
              command: ["sh", "-c", "php artisan horizon:status | grep -q running"]
            initialDelaySeconds: 60
            periodSeconds: 60
            timeoutSeconds: 15
            failureThreshold: 3
      volumes:
        - name: label-spool
          persistentVolumeClaim:
            claimName: cilupbah-label-spool
