apiVersion: apps/v1
kind: Deployment
metadata:
  name: cilupbah-app
  namespace: cilupbah
spec:
  replicas: 2
  # ── Zero-downtime deploy ──
  # maxUnavailable: 0 → pod lama WAJIB tetap Running sampai pod baru Ready.
  # maxSurge: 1     → hanya 1 pod ekstra (hemat RAM) selama transisi.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: cilupbah-app
  template:
    metadata:
      labels:
        app: cilupbah-app
    spec:
      imagePullSecrets:
        - name: ghcr-creds
      containers:
        - name: app
          # tag ini akan diganti otomatis oleh workflow production-deploy.yml (kubectl set image)
          image: ghcr.io/ultra-teknologi-indonesia/cilupbah:v1.0.0
          command: ["/usr/local/bin/start.production.sh"]
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: cilupbah-env
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "2Gi"
              cpu: "500m"
          # ── Readiness: kapan pod menerima traffic ──
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # ── Liveness: kapan pod di-restart ──
          # Threshold 5 × period 30s = pod harus gagal 2.5 menit berturut-turut
          # sebelum di-restart. Mencegah restart agresif saat lonjakan beban.
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: cilupbah-app
  namespace: cilupbah
spec:
  type: NodePort
  selector:
    app: cilupbah-app
  ports:
    - port: 80
      targetPort: 8000
      nodePort: 30080
