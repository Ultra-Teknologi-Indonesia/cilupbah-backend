apiVersion: apps/v1
kind: Deployment
metadata:
  name: cilupbah-app
  namespace: cilupbah
spec:
  replicas: 3
  # ── Zero-downtime deploy ──
  # maxUnavailable: 0 → pod lama WAJIB tetap Running sampai pod baru Ready.
  # maxSurge: 1     → hanya 1 pod ekstra (hemat RAM) selama transisi.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: cilupbah-app
  template:
    metadata:
      labels:
        app: cilupbah-app
    spec:
      imagePullSecrets:
        - name: ghcr-creds
      containers:
        - name: app
          # tag ini akan diganti otomatis oleh workflow production-deploy.yml (kubectl set image)
          image: ghcr.io/ultra-teknologi-indonesia/cilupbah:v1.0.0
          command: ["/usr/local/bin/start.production.sh"]
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: cilupbah-env
          # Explicitly override a stale secret value. This prevents a long
          # job from becoming visible to another worker before it finishes.
          env:
            # SSE is bounded separately from background workers. Keep this
            # explicit so a stale cilupbah-env secret cannot leave production
            # at the old default of 3 connections.
            - name: REALTIME_MAX_ACTIVE_CONNECTIONS
              value: "20"
            - name: REDIS_LONG_QUEUE_RETRY_AFTER
              value: "2160"
            - name: LABEL_LOCAL_FIRST
              value: "true"
            - name: LABEL_PRINT_SPOOL_ROOT
              value: "/var/www/html/storage/app/print-spool"
          volumeMounts:
            - name: label-spool
              mountPath: /var/www/html/storage/app/print-spool
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sleep", "5"]
          # ── Readiness: kapan pod menerima traffic ──
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # ── Liveness: kapan pod di-restart ──
          # Threshold 5 × period 30s = pod harus gagal 2.5 menit berturut-turut
          # sebelum di-restart. Mencegah restart agresif saat lonjakan beban.
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
      volumes:
        - name: label-spool
          persistentVolumeClaim:
            claimName: cilupbah-label-spool
---
apiVersion: v1
kind: Service
metadata:
  name: cilupbah-app
  namespace: cilupbah
spec:
  type: NodePort
  selector:
    app: cilupbah-app
  ports:
    - port: 80
      targetPort: 8000
      nodePort: 30080
