apiVersion: apps/v1
kind: Deployment
metadata:
  name: cilupbah-app
  namespace: cilupbah
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cilupbah-app
  template:
    metadata:
      labels:
        app: cilupbah-app
    spec:
      imagePullSecrets:
        - name: ghcr-creds
      containers:
        - name: app
          # tag ini akan diganti otomatis oleh workflow production-deploy.yml (kubectl set image)
          image: ghcr.io/ultra-teknologi-indonesia/cilupbah:v1.0.0
          command: ["/usr/local/bin/start.production.sh"]
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: cilupbah-env
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: cilupbah-app
  namespace: cilupbah
spec:
  selector:
    app: cilupbah-app
  ports:
    - port: 80
      targetPort: 8000
      nodePort: 30080
