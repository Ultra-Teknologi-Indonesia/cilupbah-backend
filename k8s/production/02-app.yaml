apiVersion: apps/v1
kind: Deployment
metadata:
  name: cilupbah-app
  namespace: cilupbah
spec:
  replicas: 3
  # App startup performs Laravel cache generation before PHP-FPM listens on
  # port 8000. Give Kubernetes enough time to observe a slow but healthy boot
  # instead of marking the rollout as failed prematurely.
  progressDeadlineSeconds: 600
  # ── Zero-downtime deploy ──
  # maxUnavailable: 0 → pod lama WAJIB tetap Running sampai pod baru Ready.
  # maxSurge: 1     → hanya 1 pod ekstra (hemat RAM) selama transisi.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: cilupbah-app
  template:
    metadata:
      labels:
        app: cilupbah-app
    spec:
      securityContext:
        fsGroup: 33
        fsGroupChangePolicy: OnRootMismatch
      imagePullSecrets:
        - name: ghcr-creds
      initContainers:
        - name: prepare-label-spool
          image: ghcr.io/ultra-teknologi-indonesia/cilupbah:v1.0.0
          command: ["sh", "-c"]
          args:
            - >-
              set -eu;
              mkdir -p /spool/items;
              chown root:33 /spool /spool/items;
              chmod 2770 /spool /spool/items;
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: label-spool
              mountPath: /spool
      containers:
        - name: app
          # tag ini akan diganti otomatis oleh workflow production-deploy.yml (kubectl set image)
          image: ghcr.io/ultra-teknologi-indonesia/cilupbah:v1.0.0
          command: ["/usr/local/bin/start.production.sh"]
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: cilupbah-env
          # Explicitly override a stale secret value. This prevents a long
          # job from becoming visible to another worker before it finishes.
          env:
            # SSE is bounded separately from background workers. Keep this
            # explicit so a stale cilupbah-env secret cannot leave production
            # at the old default of 3 connections.
            - name: REALTIME_MAX_ACTIVE_CONNECTIONS
              value: "20"
            - name: REDIS_LONG_QUEUE_RETRY_AFTER
              value: "2160"
            - name: REDIS_QUEUE_RETRY_AFTER
              value: "660"
            - name: REDIS_QUEUE_CONNECTION
              value: "horizon"
            - name: QUEUE_BACKPRESSURE_ENABLED
              value: "true"
            - name: CHANNEL_SYNC_MAX_QUEUE_DEPTH
              value: "24"
            - name: CHANNEL_SYNC_MAX_REDIS_MEMORY_RATIO
              value: "0.70"
            - name: WEBHOOK_INGRESS_MAX_QUEUE_DEPTH
              value: "1000"
            - name: WEBHOOK_INGRESS_MAX_REDIS_MEMORY_RATIO
              value: "0.70"
            - name: WEBHOOK_REPLAY_MAX_QUEUE_DEPTH
              value: "500"
            - name: QUEUE_HEALTH_OLDEST_WARNING_SECONDS
              value: "300"
            - name: QUEUE_HEALTH_OLDEST_CRITICAL_SECONDS
              value: "900"
            - name: QUEUE_HEALTH_STALE_WEBHOOK_WARNING
              value: "100"
            - name: QUEUE_HEALTH_FAILED_JOBS_WINDOW_MINUTES
              value: "15"
            - name: QUEUE_HEALTH_FAILED_JOBS_WARNING
              value: "10"
            - name: QUEUE_HEALTH_FAILED_JOBS_CRITICAL
              value: "50"
            - name: LABEL_LOCAL_FIRST
              value: "true"
            - name: LABEL_PRINT_SPOOL_ROOT
              value: "/var/www/html/storage/app/print-spool"
            - name: GOTENBERG_URL
              value: "http://cilupbah-gotenberg:3000"
          volumeMounts:
            - name: label-spool
              mountPath: /var/www/html/storage/app/print-spool
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sleep", "5"]
          # The entrypoint prepares Laravel and starts supervisord before the
          # HTTP port exists. This probe gates readiness/liveness during that
          # startup window without changing request handling after boot.
          startupProbe:
            httpGet:
              path: /healthz
              port: 8000
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          # ── Readiness: kapan pod menerima traffic ──
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # ── Liveness: kapan pod di-restart ──
          # Threshold 5 × period 30s = pod harus gagal 2.5 menit berturut-turut
          # sebelum di-restart. Mencegah restart agresif saat lonjakan beban.
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
      volumes:
        - name: label-spool
          persistentVolumeClaim:
            claimName: cilupbah-label-spool
---
apiVersion: v1
kind: Service
metadata:
  name: cilupbah-app
  namespace: cilupbah
spec:
  type: NodePort
  selector:
    app: cilupbah-app
  ports:
    - port: 80
      targetPort: 8000
      nodePort: 30080
