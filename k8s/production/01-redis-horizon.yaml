apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cilupbah-redis-horizon-data
  namespace: cilupbah
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cilupbah-redis-horizon
  namespace: cilupbah
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cilupbah-redis-horizon
  template:
    metadata:
      labels:
        app: cilupbah-redis-horizon
    spec:
      containers:
        - name: redis-horizon
          image: redis:7-alpine
          command:
            - redis-server
            - --maxmemory
            - "640mb"
            - --maxmemory-policy
            # Horizon stores supervisor/control metadata here. Silent eviction can
            # make the dashboard and worker control plane inconsistent; retention
            # and monitoring must resolve pressure before writes are rejected.
            - noeviction
            - --appendonly
            - "yes"
            - --appendfsync
            - everysec
            - --dir
            - /data
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              memory: "1Gi"
              cpu: "250m"
            limits:
              # Redis RSS and AOF rewrite need headroom beyond maxmemory.
              memory: "2Gi"
              cpu: "500m"
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: cilupbah-redis-horizon-data
---
apiVersion: v1
kind: Service
metadata:
  name: redis-horizon
  namespace: cilupbah
spec:
  selector:
    app: cilupbah-redis-horizon
  ports:
    - port: 6379
      targetPort: 6379
