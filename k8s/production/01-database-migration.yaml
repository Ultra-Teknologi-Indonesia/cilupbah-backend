apiVersion: batch/v1
kind: Job
metadata:
  generateName: cilupbah-database-migration-
  namespace: cilupbah
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ghcr-creds
      containers:
        - name: migrate
          image: ghcr.io/ultra-teknologi-indonesia/cilupbah:v1.0.0
          command: ["php", "artisan", "migrate", "--force"]
          envFrom:
            - secretRef:
                name: cilupbah-env
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
