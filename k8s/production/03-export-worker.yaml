apiVersion: apps/v1
kind: Deployment
metadata:
  name: cilupbah-export-worker
  namespace: cilupbah
  labels:
    # Harus konsisten dengan selector Deployment production yang sudah ada.
    app: cilupbah-export-worker
    component: cilupbah-export-worker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cilupbah-export-worker
  template:
    metadata:
      labels:
        app: cilupbah-export-worker
        component: cilupbah-export-worker
    spec:
      terminationGracePeriodSeconds: 960
      imagePullSecrets:
        - name: ghcr-creds
      containers:
        - name: export-worker
          image: ghcr.io/ultra-teknologi-indonesia/cilupbah:v1.0.0
          command:
            - sh
            - -c
            - |
              child_pid=""
              stop_worker() {
                if [ -n "${child_pid:-}" ]; then
                  kill -TERM "$child_pid" 2>/dev/null || true
                  wait "$child_pid" 2>/dev/null || true
                fi
                exit 0
              }
              trap stop_worker INT TERM
              while true; do
                php artisan queue:work redis-long \
                  --queue=exports-sheet --sleep=3 --tries=2 --backoff=30 \
                  --timeout=780 --memory=768 --max-jobs=1 --max-time=720 &
                child_pid=$!
                wait "$child_pid"
                exit_code=$?
                child_pid=""
                if [ "$exit_code" -ne 0 ]; then
                  exit "$exit_code"
                fi
                sleep 1
              done
          envFrom:
            - secretRef:
                name: cilupbah-env
          livenessProbe:
            exec:
              command: ["sh", "-c", "kill -0 1"]
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["sh", "-c", "kill -0 1"]
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
