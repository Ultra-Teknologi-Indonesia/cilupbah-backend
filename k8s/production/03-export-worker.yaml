apiVersion: apps/v1
kind: Deployment
metadata:
  name: cilupbah-export-worker
  namespace: cilupbah
  labels:
    app: cilupbah-export-worker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cilupbah-sheet-export-worker
  template:
    metadata:
      labels:
        app: cilupbah-export-worker
    spec:
      terminationGracePeriodSeconds: 960
      imagePullSecrets:
        - name: ghcr-creds
      containers:
        - name: export-worker
          image: ghcr.io/ultra-teknologi-indonesia/cilupbah:v1.0.0
          command:
            - php
            - artisan
            - queue:work
            - redis-long
            - --queue=exports-sheet
            - --sleep=3
            - --tries=2
            - --backoff=30
            - --timeout=780
            - --memory=768
            - --max-jobs=1
            - --max-time=720
          envFrom:
            - secretRef:
                name: cilupbah-env
          livenessProbe:
            exec:
              command: ["sh", "-c", "kill -0 1"]
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["sh", "-c", "kill -0 1"]
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
