apiVersion: apps/v1
kind: Deployment
metadata:
  name: cilupbah-export-worker
  namespace: cilupbah
  labels:
    # Harus konsisten dengan selector Deployment production yang sudah ada.
    app: cilupbah-export-worker
    component: cilupbah-export-worker
spec:
  replicas: 2
  revisionHistoryLimit: 2
  progressDeadlineSeconds: 1500
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: cilupbah-export-worker
  template:
    metadata:
      labels:
        app: cilupbah-export-worker
        component: cilupbah-export-worker
    spec:
      priorityClassName: cilupbah-batch
      terminationGracePeriodSeconds: 960
      imagePullSecrets:
        - name: ghcr-creds
      containers:
        - name: export-worker
          image: ghcr.io/ultra-teknologi-indonesia/cilupbah:v1.0.0
          command:
            - sh
            - -c
            - |
              exec /usr/local/bin/queue-worker.sh redis-long \
                --queue=exports-sheet --sleep=1 --tries=2 --backoff=30 \
                --timeout=780 --memory=768 --max-jobs=100 --max-time=720
          envFrom:
            - secretRef:
                name: cilupbah-env
          env:
            - name: REDIS_LONG_QUEUE_RETRY_AFTER
              value: "2160"
            - name: QUEUE_WORKER_STARTUP_JITTER_MAX_SECONDS
              value: "45"
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1536Mi"
              cpu: "1000m"
