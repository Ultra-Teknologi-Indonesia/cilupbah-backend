apiVersion: apps/v1
kind: Deployment
metadata:
  name: cilupbah-redis-cache
  namespace: cilupbah
spec:
  # Production still routes cache to DB 1 on the primary Redis. Keep this
  # service as a cold migration target instead of reserving RAM for an unused
  # datastore. A future cutover must raise replicas together with REDIS_CACHE_HOST.
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cilupbah-redis-cache
  template:
    metadata:
      labels:
        app: cilupbah-redis-cache
    spec:
      priorityClassName: cilupbah-online-support
      containers:
        - name: redis-cache
          image: redis:7-alpine
          command:
            - redis-server
            - --maxmemory
            - "512mb"
            - --maxmemory-policy
            - allkeys-lru
            - --save
            - ""
            - --appendonly
            - "no"
          ports:
            - containerPort: 6379
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "768Mi"
              cpu: "500m"
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: redis-cache
  namespace: cilupbah
spec:
  selector:
    app: cilupbah-redis-cache
  ports:
    - port: 6379
      targetPort: 6379
