apiVersion: apps/v1
kind: Deployment
metadata:
  name: cilupbah-import-worker
  namespace: cilupbah
spec:
  replicas: 1
  revisionHistoryLimit: 2
  # A running import may drain for up to 31 minutes during a safe rollout.
  progressDeadlineSeconds: 2400
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cilupbah-import-worker
  template:
    metadata:
      labels:
        app: cilupbah-import-worker
    spec:
      imagePullSecrets:
        - name: ghcr-creds
      terminationGracePeriodSeconds: 1860
      containers:
        - name: import-worker
          image: ghcr.io/ultra-teknologi-indonesia/cilupbah:v1.0.0
          command:
            - sh
            - -c
            - |
              child_pid=""
              pid_file=/tmp/worker.pid
              stop_worker() {
                if [ -n "${child_pid:-}" ]; then
                  kill -TERM "$child_pid" 2>/dev/null || true
                  wait "$child_pid" 2>/dev/null || true
                fi
                rm -f "$pid_file"
                exit 0
              }
              trap stop_worker INT TERM
              while true; do
                php artisan queue:work redis-long \
                  --queue=imports --sleep=3 --tries=1 --timeout=1800 \
                  --memory=1024 --max-jobs=1 --max-time=1740 &
                child_pid=$!
                echo "$child_pid" > "$pid_file"
                wait "$child_pid"
                exit_code=$?
                child_pid=""
                rm -f "$pid_file"
                if [ "$exit_code" -ne 0 ]; then
                  exit "$exit_code"
                fi
                sleep 1
              done
          envFrom:
            - secretRef:
                name: cilupbah-env
          env:
            - name: REDIS_LONG_QUEUE_RETRY_AFTER
              value: "2160"
          livenessProbe:
            exec:
              command: ["sh", "-c", "kill -0 1"]
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["sh", "-c", "test -s /tmp/worker.pid && kill -0 \"$(cat /tmp/worker.pid)\""]
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "1536Mi"
              cpu: "1000m"
