apiVersion: apps/v1
kind: Deployment
metadata:
  name: cilupbah-import-worker
  namespace: cilupbah
spec:
  replicas: 1
  revisionHistoryLimit: 2
  # A running import may drain for up to 31 minutes during a safe rollout.
  progressDeadlineSeconds: 2400
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: cilupbah-import-worker
  template:
    metadata:
      labels:
        app: cilupbah-import-worker
    spec:
      priorityClassName: cilupbah-batch
      imagePullSecrets:
        - name: ghcr-creds
      terminationGracePeriodSeconds: 1860
      containers:
        - name: import-worker
          image: ghcr.io/ultra-teknologi-indonesia/cilupbah:v1.0.0
          command:
            - sh
            - -c
            - |
              # PHP must be PID 1 so Kubernetes SIGTERM reaches Laravel
              # directly. A shell wrapper waiting on a child can swallow the
              # signal and leave long-running deployments stuck in Terminating.
              exec /usr/local/bin/queue-worker.sh redis-long \
                --queue=imports --sleep=1 --tries=1 --timeout=1800 \
                --memory=1024 --max-jobs=100 --max-time=1740
          envFrom:
            - secretRef:
                name: cilupbah-env
          env:
            - name: REDIS_LONG_QUEUE_RETRY_AFTER
              value: "2160"
            - name: QUEUE_WORKER_STARTUP_JITTER_MAX_SECONDS
              value: "30"
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
