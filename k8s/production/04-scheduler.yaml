apiVersion: batch/v1
kind: CronJob
metadata:
  name: cilupbah-scheduler
  namespace: cilupbah
spec:
  schedule: "* * * * *"
  # This is the primary overlap guard. Unlike Laravel cache locks it continues
  # to work when Redis cache or CoreDNS is impaired.
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 30
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      # A hung foreground scheduled command cannot grow indefinitely. Long
      # operations must run in their dedicated bounded queue instead.
      activeDeadlineSeconds: 900
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app: cilupbah-scheduler
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: ghcr-creds
          containers:
            - name: scheduler
              image: ghcr.io/ultra-teknologi-indonesia/cilupbah:v1.0.0
              command: ["php", "artisan", "schedule:run", "--no-interaction"]
              envFrom:
                - secretRef:
                    name: cilupbah-env
              resources:
                requests:
                  memory: "256Mi"
                  cpu: "100m"
                limits:
                  memory: "768Mi"
                  cpu: "500m"
