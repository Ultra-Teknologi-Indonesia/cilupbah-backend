apiVersion: apps/v1
kind: Deployment
metadata:
  name: cilupbah-scheduler
  namespace: cilupbah
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cilupbah-scheduler
  template:
    metadata:
      labels:
        app: cilupbah-scheduler
    spec:
      imagePullSecrets:
        - name: ghcr-creds
      containers:
        - name: scheduler
          image: ghcr.io/ultra-teknologi-indonesia/cilupbah:v1.0.0
          command: ["php", "artisan", "schedule:work"]
          envFrom:
            - secretRef:
                name: cilupbah-env
          # Deteksi scheduler yang hang (hidup tapi berhenti menjadwalkan):
          # task 'scheduler-heartbeat' (routes/console.php) menyentuh file ini
          # tiap menit. Bila file lebih tua dari 180 dtk, probe gagal → restart.
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - test $(( $(date +%s) - $(stat -c %Y /var/www/html/storage/framework/scheduler-heartbeat 2>/dev/null || echo 0) )) -lt 180
            initialDelaySeconds: 120
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 3
