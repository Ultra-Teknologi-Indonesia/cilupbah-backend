version: "3.8"

# Menggunakan fitur YAML Anchor agar config tidak ditulis berulang-ulang
x-app-config: &app-config
  image: ghcr.io/ultra-teknologi-indonesia/cilupbah:latest
  restart: unless-stopped
  environment:
    - APP_ENV=staging
    - APP_DEBUG=false
    - PHP_INI_SCAN_DIR=/usr/local/etc/php/conf.d:/var/www/html/docker/php
  depends_on:
    - redis
  volumes:
    # Mount file .env langsung ke root aplikasi di dalam container
    - /var/www/cilupbah/.env:/var/www/html/.env
    # Mount folder yang isinya berubah/dinamis di production
    - /var/www/cilupbah/storage/app:/var/www/html/storage/app
    - /var/www/cilupbah/storage/framework:/var/www/html/storage/framework
    - /var/www/cilupbah/storage/logs:/var/www/html/storage/logs
    - /var/www/cilupbah/bootstrap/cache:/var/www/html/bootstrap/cache

services:
  app:
    <<: *app-config
    container_name: cilupbah-staging
    entrypoint: ["/usr/local/bin/start.staging.sh"]
    ports:
      - "8001:8000"

  horizon:
    <<: *app-config
    container_name: cilupbah-staging-horizon
    entrypoint: ["php", "artisan", "horizon"]

  scheduler:
    <<: *app-config
    container_name: cilupbah-staging-scheduler
    entrypoint: ["php", "artisan", "schedule:work"]

  redis:
    container_name: cilupbah-staging-redis
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --maxmemory
      - "512mb"
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --appendonly
      - "no"
    volumes:
      - staging_redisdata:/data

volumes:
  staging_redisdata:
