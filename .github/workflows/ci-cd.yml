name: CI/CD Pipeline

permissions:
  contents: write # perlu write karena workflow ini membuat & push git tag versi
  packages: write

on:
  push:
    branches: [main]
  pull_request:
    branches:
      [main] # default types: opened, synchronize, reopened
      # -> ini CI gate SEBELUM merge, bukan setelah PR ditutup
  workflow_dispatch:

concurrency:
  # PR checks boleh saling cancel (perilaku CI normal),
  # tapi run menuju main HARUS antre (tidak boleh cancel-in-progress)
  # supaya tidak ada 2 run yang rebutan bikin versi/tag yang sama.
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'release-main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_BASE: ghcr.io/ultra-teknologi-indonesia/cilupbah

jobs:
  # ─────────────────────────────────────────────
  # CI — jalan di semua trigger, tapi ini gate untuk PR.
  # Tidak melakukan docker build / push / deploy sama sekali.
  # ─────────────────────────────────────────────
  validate:
    name: Validate Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo,pdo_pgsql,pgsql,zip,gd,bcmath,exif,intl
          coverage: none

      - name: Cache Composer vendor
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Validate Composer
        run: composer validate --strict

      # OAuth token mencegah GitHub API rate-limit (429) saat Composer
      # mengunduh package dari codeload.github.com. Token ini otomatis
      # tersedia di semua workflow dan tidak perlu disimpan sebagai secret.
      - name: Configure GitHub OAuth for Composer
        run: composer config -g github-oauth.github.com "${{ secrets.GITHUB_TOKEN }}"

      - name: Install Composer Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: npm ci
        run: npm ci

      - name: npm run build
        run: npm run build

      - name: Run Tests (optional)
        run: php artisan test
        continue-on-error: true

  # ─────────────────────────────────────────────
  # CD — hanya jalan untuk push ke main / workflow_dispatch.
  # Auto version -> git tag -> buildx multi-tag -> push GHCR.
  # ─────────────────────────────────────────────
  build:
    name: Build & Push Docker Image
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    outputs:
      version_tag: ${{ steps.version.outputs.new_tag }}
      short_sha: ${{ steps.vars.outputs.short_sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # perlu full history supaya bisa baca tag terakhir

      - name: Set short SHA
        id: vars
        run: echo "short_sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Determine Next Patch Version
        id: version
        run: |
          LAST_TAG=$(git tag -l 'v*' --sort=-v:refname | head -n1)
          if [ -z "$LAST_TAG" ]; then
            NEW_TAG="v1.0.0"
          else
            BASE=${LAST_TAG#v}
            MAJOR=$(echo "$BASE" | cut -d. -f1)
            MINOR=$(echo "$BASE" | cut -d. -f2)
            PATCH=$(echo "$BASE" | cut -d. -f3)
            NEW_TAG="v${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi
          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"

      - name: Create & Push Git Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.version.outputs.new_tag }}
          git push origin ${{ steps.version.outputs.new_tag }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo,pdo_pgsql,pgsql,zip,gd,bcmath,exif,intl
          coverage: none

      - name: Cache Composer vendor
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      # OAuth token mencegah GitHub API rate-limit (429) saat Composer
      # mengunduh package dari codeload.github.com.
      - name: Configure GitHub OAuth for Composer
        run: composer config -g github-oauth.github.com "${{ secrets.GITHUB_TOKEN }}"

      - name: Install Production Composer Dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --classmap-authoritative --no-progress

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Image (multi-tag)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.IMAGE_BASE }}:latest
            ${{ env.IMAGE_BASE }}:${{ steps.version.outputs.new_tag }}
            ${{ env.IMAGE_BASE }}:sha-${{ steps.vars.outputs.short_sha }}

  deploy:
    name: Deploy Staging
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.STAGING_DEPLOY_SERVER }}
          username: ${{ secrets.STAGING_DEPLOY_USER }}
          key: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          timeout: 60m
          command_timeout: 60m
          script: |
            set -e

            cd ${{ secrets.STAGING_DEPLOY_PATH }}

            # 1. Update file docker-compose.staging.yml dari repository
            PREVIOUS_COMMIT=$(git rev-parse HEAD || echo "")
            git fetch origin main
            git reset --hard origin/main
            CURRENT_COMMIT=$(git rev-parse HEAD)

            # 2. Gunakan project name yang tetap agar Compose dapat mengenali
            # container miliknya walaupun path checkout di VPS berubah.
            COMPOSE_PROJECT=cilupbah-staging
            COMPOSE_FILE=docker-compose.staging.yml
            export CILUPBAH_IMAGE_TAG="${{ needs.build.outputs.version_tag }}"

            # 3. Bersihkan container staging lama yang dibuat oleh project
            # berbeda/manual. `--remove-orphans` hanya membersihkan orphan
            # dari project Compose yang sedang aktif, sehingga tidak menangani
            # fixed container_name seperti cilupbah-staging-redis di bawah.
            # Hanya nama container staging yang eksplisit yang disentuh;
            # volume database/Redis tidak ikut dihapus.
            for container in \
              cilupbah-staging \
              cilupbah-staging-horizon \
              cilupbah-staging-scheduler \
              cilupbah-staging-redis \
              cilupbah-staging-db; do
              if docker container inspect "$container" >/dev/null 2>&1; then
                OWNER=$(docker inspect -f '{{ index .Config.Labels "com.docker.compose.project" }}' "$container" 2>/dev/null || true)
                if [ "$OWNER" != "$COMPOSE_PROJECT" ]; then
                  echo "Removing stale staging container $container (Compose project: ${OWNER:-none})"
                  docker rm -f "$container"
                fi
              fi
            done

            # 4. Pull image versi build yang tepat dari GHCR.
            # Retry menangani gangguan transient saat containerd mengekstrak layer.
            pull_image() {
              attempt=1
              while [ "$attempt" -le 3 ]; do
                if docker compose -p "$COMPOSE_PROJECT" -f "$COMPOSE_FILE" pull; then
                  return 0
                fi
                if [ "$attempt" -lt 3 ]; then
                  echo "Pull image gagal (percobaan $attempt/3), retry dalam $((attempt * 15)) detik..."
                  sleep $((attempt * 15))
                fi
                attempt=$((attempt + 1))
              done
              echo "Pull image gagal setelah 3 percobaan."
              return 1
            }
            pull_image

            # 5. Restart container dengan image baru
            docker compose -p "$COMPOSE_PROJECT" -f "$COMPOSE_FILE" up -d --remove-orphans

            # 6. Clear & Cache Konfigurasi Laravel
            docker exec cilupbah-staging php artisan optimize:clear
            sleep 20
            docker exec cilupbah-staging php artisan config:cache
            sleep 20
            docker exec cilupbah-staging php artisan route:cache
            sleep 20
            docker exec cilupbah-staging php artisan view:cache
            sleep 20

            # 7. Jalankan Migrasi Database
            docker exec cilupbah-staging php artisan migrate --force

            # 8. Cek & Jalankan Seeder (opsional berdasarkan file changes)
            HAS_SEEDER_CHANGE=$(git diff --name-only "$PREVIOUS_COMMIT" "$CURRENT_COMMIT" | grep -ci '/seeders/' || true)
            if [ "$HAS_SEEDER_CHANGE" -gt 0 ]; then
              docker exec cilupbah-staging php artisan db:seed --force || true
            fi

            # 9. Restart Horizon Queue Worker
            docker exec cilupbah-staging php artisan horizon:terminate || true

            # 10. Cleanup image lama — sisakan HANYA yang sedang jalan (KEEP=1).
            # Ditaruh SETELAH up -d + migrasi sukses; `set -e` sudah menghentikan
            # script di atas kalau deploy gagal, jadi image lama tetap utuh untuk
            # rollback. SCOPED ke repo ini saja — VPS staging dipakai bersama app
            # lain (Gitea dll), jadi JANGAN `prune -af` global. `docker rmi`
            # gagal-aman untuk image yang sedang dipakai container, jadi yang jalan
            # selamat. `image prune -f` (tanpa -a) cuma buang layer dangling.
            # Rollback ditangani ci-cd-production.yml (pin versi dari GHCR).
            docker images "${{ env.IMAGE_BASE }}" --format '{{.Repository}}:{{.Tag}}' \
              | grep -v ':<none>$' | xargs -r -n1 docker rmi 2>/dev/null || true
            docker image prune -f

            echo "Deployment Success"
