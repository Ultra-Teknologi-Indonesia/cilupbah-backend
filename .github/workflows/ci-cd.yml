name: CI/CD Pipeline
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:

jobs:
  validate:
    name: Validate Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo, pdo_pgsql, pgsql, zip, gd, bcmath, exif, intl
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --optimize-autoloader
        env:
          COMPOSER_PROCESS_TIMEOUT: 0
          COMPOSER_NO_INTERACTION: 1
          COMPOSER_NO_AUDIT: 1

      - name: Validate composer.json
        run: composer validate --strict

  deploy:
    name: Deploy to VPS
    needs: validate
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_SERVER }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 60m
          command_timeout: 60m
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}

            # ── Save current commit before pulling ────────────────────────────
            PREVIOUS_COMMIT=$(git rev-parse HEAD)
            echo "Previous commit: $PREVIOUS_COMMIT"

            # ── Rollback handler ──────────────────────────────────────────────
            rollback() {
              echo "⚠️  Deployment failed — rolling back to $PREVIOUS_COMMIT"
              git reset --hard "$PREVIOUS_COMMIT"

              # Bersihkan semua container dulu sebelum naik kembali
              docker compose -f docker-compose.staging.yml down --remove-orphans --timeout 30
              docker compose -f docker-compose.staging.yml up -d --build

              echo "✅ Rollback complete"
              exit 1
            }
            trap rollback ERR

            # ── Pull latest code ──────────────────────────────────────────────
            git fetch origin main
            git reset --hard origin/main

            # ── Rebuild & Restart: down dulu, baru up ────────────────────────
            echo "Stopping existing containers..."
            docker compose -f docker-compose.staging.yml down --remove-orphans --timeout 30

            echo "Building and starting containers..."
            docker compose -f docker-compose.staging.yml up -d --build

            # ── Health check sederhana ────────────────────────────────────────
            echo "Waiting for app to be ready..."
            sleep 5
            docker compose -f docker-compose.staging.yml ps --filter "status=running" | grep -q "cilupbah-staging" \
              || { echo "❌ Container not running after deploy!"; exit 1; }

            trap - ERR
            echo "✅ Deployment successful"