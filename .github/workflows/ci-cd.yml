name: CI/CD Pipeline
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:

concurrency:
  group: staging-deployment
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo, pdo_pgsql, pgsql, zip, gd, bcmath, exif, intl
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --optimize-autoloader
        env:
          COMPOSER_PROCESS_TIMEOUT: 0
          COMPOSER_NO_INTERACTION: 1
          COMPOSER_NO_AUDIT: 1

      - name: Validate composer.json
        run: composer validate --strict

  deploy:
    name: Deploy to VPS
    needs: validate
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_SERVER }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 60m
          command_timeout: 60m
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}

            # ── Save current commit before pulling ────────────────────────────
            PREVIOUS_COMMIT=$(git rev-parse HEAD)
            echo "Previous commit: $PREVIOUS_COMMIT"

            # ── Pull latest code (volume-mounted, instantly live) ─────────────
            git fetch origin main
            git reset --hard origin/main

            CURRENT_COMMIT=$(git rev-parse HEAD)
            echo "Current commit: $CURRENT_COMMIT"

            # ── Detect what changed ───────────────────────────────────────────
            CHANGED_FILES=$(git diff --name-only "$PREVIOUS_COMMIT" "$CURRENT_COMMIT")
            HAS_COMPOSER_CHANGE=$(echo "$CHANGED_FILES" | grep -c 'composer.lock' || true)
            HAS_NPM_CHANGE=$(echo "$CHANGED_FILES" | grep -c 'package-lock.json' || true)
            HAS_DOCKER_CHANGE=$(echo "$CHANGED_FILES" | grep -cE 'Dockerfile|docker-compose|start\.(staging\.)?sh' || true)
            HAS_MIGRATION_CHANGE=$(echo "$CHANGED_FILES" | grep -c '/migrations/' || true)
            HAS_SEEDER_CHANGE=$(echo "$CHANGED_FILES" | grep -ci '/seeders/' || true)

            # ── Rollback handler ──────────────────────────────────────────────
            rollback() {
              echo "⚠️  Deployment failed — rolling back to $PREVIOUS_COMMIT"
              git reset --hard "$PREVIOUS_COMMIT"
              # Restart containers to pick up rolled-back code
              docker compose -f docker-compose.staging.yml restart app horizon scheduler
              echo "✅ Rollback complete"
              exit 1
            }
            trap rollback ERR

            # ── Rebuild containers ONLY if Docker config changed ──────────────
            if [ "$HAS_DOCKER_CHANGE" -gt 0 ]; then
              echo "Docker config changed — rebuilding containers..."
              docker compose -f docker-compose.staging.yml up -d --build --remove-orphans
              echo "Waiting for containers to be ready..."
              sleep 10
            else
              echo "No Docker config changes — containers stay running."
            fi

            # ── Install dependencies inside running container (if changed) ────
            if [ "$HAS_COMPOSER_CHANGE" -gt 0 ]; then
              echo "composer.lock changed — installing PHP dependencies..."
              docker exec cilupbah-staging composer install --no-dev --optimize-autoloader --no-interaction
            fi

            if [ "$HAS_NPM_CHANGE" -gt 0 ]; then
              echo "package-lock.json changed — installing & building frontend..."
              docker exec cilupbah-staging npm ci
              docker exec cilupbah-staging npm run build
            fi

            # ── Refresh caches (always, fast & safe) ──────────────────────────
            echo "Refreshing Laravel caches..."
            docker exec cilupbah-staging php artisan config:cache
            docker exec cilupbah-staging php artisan route:cache
            docker exec cilupbah-staging php artisan view:cache

            # ── Run Migrations (only if migration files changed) ──────────────
            if [ "$HAS_MIGRATION_CHANGE" -gt 0 ]; then
              echo "Running database migrations..."
              docker exec cilupbah-staging php artisan migrate --force || { echo "❌ Migration failed!"; exit 1; }
            else
              echo "No migration changes — skipping."
            fi

            # ── Run Seeders (only if seeder files changed) ────────────────────
            if [ "$HAS_SEEDER_CHANGE" -gt 0 ]; then
              echo "Running database seeders..."
              docker exec cilupbah-staging php artisan db:seed --force \
                || echo "⚠️  Seeding reported issues — review logs above (deploy continues)."
            else
              echo "No seeder changes — skipping."
            fi

            # ── Restart queue workers to pick up new code ─────────────────────
            echo "Restarting Horizon workers..."
            docker exec cilupbah-staging php artisan horizon:terminate 2>/dev/null || true

            trap - ERR
            echo "✅ Deployment successful (zero-downtime)"
