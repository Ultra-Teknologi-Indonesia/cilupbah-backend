name: CI/CD Pipeline (Production)

permissions:
  contents: read
  packages: read

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Pilih versi. 'latest' = deploy versi terbaru otomatis; vX.Y.Z = rollback ke versi itu."
        required: true
        type: choice
        default: latest
        options:
          - latest
          # BEGIN_VERSIONS (di-generate otomatis oleh CI staging tiap rilis — jangan edit manual)
          - v1.0.760
          - v1.0.759
          - v1.0.758
          - v1.0.757
          - v1.0.756
          - v1.0.755
          - v1.0.754
          - v1.0.753
          - v1.0.752
          - v1.0.751
          # END_VERSIONS

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────
  # Sanity check dulu SEBELUM nyentuh production:
  # - format versi harus vX.Y.Z (hindari typo)
  # - image dengan tag itu harus benar-benar ada di GHCR
  # ─────────────────────────────────────────────
  validate-input:
    name: Validate Version Input
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Checkout (untuk baca git tag saat resolve 'latest')
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve versi
        id: resolve
        run: |
          V="${{ inputs.version }}"
          if [ "$V" = "latest" ]; then
            V=$(git tag -l 'v*' --sort=-v:refname | head -n1)
            if [ -z "$V" ]; then
              echo "Tak ada tag vX.Y.Z di repo."; exit 1
            fi
            echo "'latest' → $V"
          fi
          if [[ ! "$V" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Versi tidak valid: $V"; exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Login GHCR (read-only)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Cek image ada di GHCR
        run: |
          docker manifest inspect ghcr.io/ultra-teknologi-indonesia/cilupbah:${{ steps.resolve.outputs.version }} > /dev/null
          echo "Image ${{ steps.resolve.outputs.version }} ditemukan di GHCR, lanjut deploy."

  # ─────────────────────────────────────────────
  # Job ini pakai `environment: production`.
  # WAJIB dibuat dulu manual di:
  # Settings > Environments > New environment > "production"
  # -> centang "Required reviewers", tambahkan reviewer
  # Kalau environment ini belum dibuat, job akan tetap jalan
  # TANPA approval gate (jadi jangan lupa setup-nya).
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    needs: validate-input
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Salin file K8s ke server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_DEPLOY_SERVER }}
          username: ${{ secrets.PROD_DEPLOY_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          source: "k8s/production/*"
          target: "/tmp/cilupbah-k8s-${{ github.run_id }}-${{ github.run_attempt }}"

      - name: Deploy via SSH ke server production
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PROD_DEPLOY_SERVER }}
          username: ${{ secrets.PROD_DEPLOY_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          timeout: 20m
          command_timeout: 20m
          script: |
            set -e

            VERSION="${{ needs.validate-input.outputs.version }}"
            IMAGE="ghcr.io/ultra-teknologi-indonesia/cilupbah:${VERSION}"

            echo "Deploying $IMAGE ke production..."
            NAMESPACE="cilupbah"
            DEPLOY_ROOT="/tmp/cilupbah-k8s-${{ github.run_id }}-${{ github.run_attempt }}"
            K8S_DIR="$DEPLOY_ROOT/k8s/production"

            cleanup() {
              rm -rf "$DEPLOY_ROOT"
            }
            trap cleanup EXIT

            echo "==> Mengupdate image tag di file YAML temporary..."
            if [ ! -f "$K8S_DIR/03-horizon-critical.yaml" ]; then
              echo "Manifest critical tidak ditemukan: $K8S_DIR/03-horizon-critical.yaml"
              echo "Isi direktori yang diterima dari SCP:"
              find "$DEPLOY_ROOT" -maxdepth 4 -type f -print 2>/dev/null || true
              exit 1
            fi
            sed -i "s|image: ghcr.io/ultra-teknologi-indonesia/cilupbah:.*|image: $IMAGE|g" "$K8S_DIR"/*.yaml

            # Hapus bentuk scheduler lama apa pun sebelum menerapkan manifest
            # baru; Kubernetes tidak mengubah kind CronJob <-> Deployment.
            kubectl delete deployment cilupbah-scheduler -n "$NAMESPACE" --ignore-not-found
            kubectl delete cronjob cilupbah-scheduler -n "$NAMESPACE" \
              --cascade=foreground --wait=true --ignore-not-found

            # Legacy recovery queues were audited empty in production. Remove
            # the retired worker before applying the active manifests so an
            # old deployment cannot block rollout or return on a later deploy.
            kubectl delete deployment cilupbah-horizon-legacy-queue-recovery \
              -n "$NAMESPACE" --cascade=foreground --wait=false --ignore-not-found

            # These low-priority label queues are now served by the labels PDF
            # pool. Delete their old masters explicitly: removing a manifest
            # alone would leave idle PHP workers consuming memory forever.
            for retired_horizon in \
              cilupbah-horizon-labels-prefetch \
              cilupbah-horizon-labels-archive \
              cilupbah-horizon-order-recovery
            do
              kubectl delete deployment "$retired_horizon" \
                -n "$NAMESPACE" --cascade=foreground --wait=false --ignore-not-found
            done

            echo "==> Menguras master Horizon lama sebelum memisahkan queue..."
            # The previous generic deployments own queues that are moved to
            # dedicated pools below. Stop them first; Redis preserves pending
            # jobs, while this prevents two masters executing a marketplace
            # side effect during the topology migration.
            for horizon in cilupbah-horizon cilupbah-horizon-critical; do
              if kubectl get deployment "$horizon" -n "$NAMESPACE" >/dev/null 2>&1; then
                kubectl scale "deployment/$horizon" --replicas=0 -n "$NAMESPACE"
                kubectl rollout status "deployment/$horizon" -n "$NAMESPACE" --timeout=360s
              else
                echo "Deployment $horizon belum ada; lanjutkan bootstrap."
              fi
            done

            echo "==> Mengaplikasikan pool queue yang terpisah ke Kubernetes..."
            for manifest in "$K8S_DIR"/*.yaml; do
              # KEDA resources are applied separately below because the CRD is
              # an optional cluster capability, not an application manifest.
              if [ "$(basename "$manifest")" = "08-keda-autoscaling.yaml" ]; then
                continue
              fi
              kubectl apply -f "$manifest" -n "$NAMESPACE"
            done

            if kubectl api-resources --api-group=keda.sh --no-headers 2>/dev/null \
              | grep -Eq '(^|[[:space:]])scaledobjects([[:space:]]|$)'; then
              echo "==> KEDA terdeteksi; mengaktifkan autoscaling berbasis backlog Redis..."
              kubectl apply -f "$K8S_DIR/08-keda-autoscaling.yaml" -n "$NAMESPACE"
            else
              echo "KEDA belum terpasang; ScaledObject dilewati. Pool kritis tetap aman, autoscaling idle non-kritis belum aktif."
            fi

            echo "==> Memastikan semua deployment Horizon memuat image dan konfigurasi terbaru..."
            # Applying an unchanged manifest does not recreate a Deployment.
            # Force a graceful restart so deploys that reuse the same image tag
            # (for example, latest) cannot leave an old Horizon process alive.
            for horizon in \
              cilupbah-horizon \
              cilupbah-horizon-critical \
              cilupbah-horizon-order-intake \
              cilupbah-horizon-fulfillment \
              cilupbah-horizon-stock \
              cilupbah-horizon-maintenance \
              cilupbah-horizon-labels \
              cilupbah-horizon-labels-awb
            do
              if kubectl get deployment "$horizon" -n "$NAMESPACE" >/dev/null 2>&1; then
                kubectl rollout restart "deployment/$horizon" -n "$NAMESPACE"
              else
                echo "Deployment $horizon belum ada; dilewati."
              fi
            done

            rollout_deployment() {
              deployment="$1"
              grace_period="$(kubectl get deployment "$deployment" -n "$NAMESPACE" \
                -o jsonpath='{.spec.template.spec.terminationGracePeriodSeconds}')"
              progress_deadline="$(kubectl get deployment "$deployment" -n "$NAMESPACE" \
                -o jsonpath='{.spec.progressDeadlineSeconds}')"

              case "$grace_period" in
                ''|*[!0-9]*) grace_period=180 ;;
              esac
              case "$progress_deadline" in
                ''|*[!0-9]*) progress_deadline=600 ;;
              esac

              # Wait for both Kubernetes' own progress deadline and the pod's
              # graceful termination window, plus a settling buffer. A fixed
              # 300s timeout can report a false failure while the rollout is
              # still converging (especially app startup and PVC workers).
              rollout_timeout=$((progress_deadline + 120))
              grace_timeout=$((grace_period + 180))
              if [ "$grace_timeout" -gt "$rollout_timeout" ]; then
                rollout_timeout="$grace_timeout"
              fi
              if [ "$rollout_timeout" -lt 300 ]; then
                rollout_timeout=300
              fi

              echo "Menunggu rollout deployment/$deployment (grace=${grace_period}s, progress-deadline=${progress_deadline}s, timeout=${rollout_timeout}s)..."
              if kubectl rollout status "deployment/$deployment" -n "$NAMESPACE" \
                --timeout="${rollout_timeout}s"; then
                return 0
              fi

              # A timeout can race with the final readiness transition. Give
              # Kubernetes one short convergence window before collecting
              # diagnostics and failing the deployment.
              echo "Rollout deployment/$deployment belum selesai; menunggu konvergensi akhir 180s..."
              if kubectl rollout status "deployment/$deployment" -n "$NAMESPACE" \
                --timeout=180s; then
                echo "Rollout deployment/$deployment selesai pada retry konvergensi."
                return 0
              fi

              echo "Rollout deployment/$deployment gagal atau timeout; mengumpulkan diagnostik..."
              kubectl get deployment "$deployment" -n "$NAMESPACE" -o wide || true
              kubectl get pods -n "$NAMESPACE" -l "app=$deployment" -o wide || true
              kubectl describe deployment "$deployment" -n "$NAMESPACE" || true
              kubectl get events -n "$NAMESPACE" --sort-by='.lastTimestamp' | tail -n 40 || true

              for pod in $(kubectl get pods -n "$NAMESPACE" -l "app=$deployment" \
                -o name 2>/dev/null); do
                kubectl describe "$pod" -n "$NAMESPACE" || true
                kubectl logs "$pod" -n "$NAMESPACE" --all-containers \
                  --tail=120 --prefix 2>/dev/null || true
              done

              return 1
            }

            echo "==> Menunggu rollout aplikasi dan layanan kritis..."
            DEPLOYMENTS=""
            for manifest in "$K8S_DIR"/*.yaml; do
              if [ "$(basename "$manifest")" = "08-keda-autoscaling.yaml" ]; then
                continue
              fi
              deployment_names="$(kubectl get -f "$manifest" -n "$NAMESPACE" -o name 2>/dev/null \
                | sed -n 's#^deployment.apps/##p')"
              if [ -n "$deployment_names" ]; then
                DEPLOYMENTS="$DEPLOYMENTS $deployment_names"
              fi
            done
            if [ -z "$DEPLOYMENTS" ]; then
              echo "Tidak ada Deployment yang ditemukan dari manifest production."
              exit 1
            fi

            for deployment in $DEPLOYMENTS; do
              case "$deployment" in
                cilupbah-import-worker|cilupbah-export-worker|cilupbah-catalog-export-worker|cilupbah-pdf-export-worker)
                  continue
                  ;;
              esac

              rollout_deployment "$deployment"
            done

            echo "==> Memulai rollout worker berat secara asynchronous (graceful drain)..."
            for deployment in \
              cilupbah-import-worker \
              cilupbah-export-worker \
              cilupbah-catalog-export-worker \
              cilupbah-pdf-export-worker
            do
              if ! kubectl get deployment "$deployment" -n "$NAMESPACE" >/dev/null 2>&1; then
                echo "Worker $deployment tidak ada; dilewati."
                continue
              fi

              # Recreate + terminationGracePeriodSeconds intentionally keeps
              # one heavy worker per queue and lets its current job drain.
              # Do only a short health check here; waiting for the full drain
              # would make every deploy take up to 31 minutes.
              if kubectl rollout status "deployment/$deployment" -n "$NAMESPACE" --timeout=20s; then
                echo "Worker $deployment sudah siap."
              else
                echo "Worker $deployment masih graceful-draining; rollout dilanjutkan oleh Kubernetes."
                kubectl get deployment "$deployment" -n "$NAMESPACE" \
                  -o custom-columns='NAME:.metadata.name,READY:.status.readyReplicas,UPDATED:.status.updatedReplicas,AVAILABLE:.status.availableReplicas,UNAVAILABLE:.status.unavailableReplicas' \
                  --no-headers || true
              fi
            done

            # Migrasi DB: explicit gated deploy step (sesuai catatan di start.production.sh).
            # Dijalankan dari pod app yang sudah ter-rollout (punya file migrasi versi baru).
            # Migrasi fitur ini additive (kolom nullable + tabel baru) → aman.
            echo "==> Menjalankan migrasi database..."
            kubectl exec deploy/cilupbah-app -n $NAMESPACE -- php artisan migrate --force

            echo "Production deployment success: $VERSION"
