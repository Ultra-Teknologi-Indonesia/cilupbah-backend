name: CI/CD Pipeline (Production)

permissions:
  contents: read
  packages: read

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Pilih versi. 'latest' = deploy versi terbaru otomatis; vX.Y.Z = rollback ke versi itu."
        required: true
        type: choice
        default: latest
        options:
          - latest
          # BEGIN_VERSIONS (di-generate otomatis oleh CI staging tiap rilis — jangan edit manual)
          - v1.0.760
          - v1.0.759
          - v1.0.758
          - v1.0.757
          - v1.0.756
          - v1.0.755
          - v1.0.754
          - v1.0.753
          - v1.0.752
          - v1.0.751
          # END_VERSIONS

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────
  # Sanity check dulu SEBELUM nyentuh production:
  # - format versi harus vX.Y.Z (hindari typo)
  # - image dengan tag itu harus benar-benar ada di GHCR
  # ─────────────────────────────────────────────
  validate-input:
    name: Validate Version Input
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Checkout (untuk baca git tag saat resolve 'latest')
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve versi
        id: resolve
        run: |
          V="${{ inputs.version }}"
          if [ "$V" = "latest" ]; then
            V=$(git tag -l 'v*' --sort=-v:refname | head -n1)
            if [ -z "$V" ]; then
              echo "Tak ada tag vX.Y.Z di repo."; exit 1
            fi
            echo "'latest' → $V"
          fi
          if [[ ! "$V" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Versi tidak valid: $V"; exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Login GHCR (read-only)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Cek image ada di GHCR
        run: |
          docker manifest inspect ghcr.io/ultra-teknologi-indonesia/cilupbah:${{ steps.resolve.outputs.version }} > /dev/null
          echo "Image ${{ steps.resolve.outputs.version }} ditemukan di GHCR, lanjut deploy."

  # ─────────────────────────────────────────────
  # Job ini pakai `environment: production`.
  # WAJIB dibuat dulu manual di:
  # Settings > Environments > New environment > "production"
  # -> centang "Required reviewers", tambahkan reviewer
  # Kalau environment ini belum dibuat, job akan tetap jalan
  # TANPA approval gate (jadi jangan lupa setup-nya).
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    needs: validate-input
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Salin file K8s ke server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_DEPLOY_SERVER }}
          username: ${{ secrets.PROD_DEPLOY_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          source: "k8s/production/*,scripts/kubernetes-capacity-preflight,scripts/kubernetes-sanitize-manifest"
          target: "/tmp/cilupbah-k8s-${{ github.run_id }}-${{ github.run_attempt }}"

      - name: Deploy via SSH ke server production
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PROD_DEPLOY_SERVER }}
          username: ${{ secrets.PROD_DEPLOY_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          timeout: 20m
          command_timeout: 3h
          script: |
            set -Eeuo pipefail

            VERSION="${{ needs.validate-input.outputs.version }}"
            IMAGE="ghcr.io/ultra-teknologi-indonesia/cilupbah:${VERSION}"

            echo "Deploying $IMAGE ke production..."
            NAMESPACE="cilupbah"
            DEPLOY_ROOT="/tmp/cilupbah-k8s-${{ github.run_id }}-${{ github.run_attempt }}"
            K8S_DIR="$DEPLOY_ROOT/k8s/production"
            DEPLOY_STAGE="bootstrap"

            cleanup() {
              rm -rf "$DEPLOY_ROOT"
            }

            report_failure() {
              exit_code="$?"
              line="$1"
              trap - ERR
              set +e
              echo "Production deployment gagal pada stage=$DEPLOY_STAGE line=$line exit=$exit_code"
              kubectl get deployments -n "$NAMESPACE" -o wide
              kubectl get pods -n "$NAMESPACE" -o wide
              kubectl get events -n "$NAMESPACE" --sort-by='.lastTimestamp' | tail -n 60
              exit "$exit_code"
            }

            trap cleanup EXIT
            trap 'report_failure "$LINENO"' ERR

            DEPLOY_STAGE="prepare-manifests"
            echo "==> Mengupdate image tag di file YAML temporary..."
            if [ ! -f "$K8S_DIR/03-horizon-critical.yaml" ]; then
              echo "Manifest critical tidak ditemukan: $K8S_DIR/03-horizon-critical.yaml"
              echo "Isi direktori yang diterima dari SCP:"
              find "$DEPLOY_ROOT" -maxdepth 4 -type f -print 2>/dev/null || true
              exit 1
            fi
            sed -i "s|image: ghcr.io/ultra-teknologi-indonesia/cilupbah:.*|image: $IMAGE|g" "$K8S_DIR"/*.yaml

            # Use one authoritative apply mode for every long-lived resource.
            # Server-side apply does not replay a poisoned
            # kubectl.kubernetes.io/last-applied-configuration annotation from
            # an older client-side deployment (for example resourceVersion: 0
            # on an existing PDB), so retries remain deterministic.
            apply_manifest() {
              kubectl apply --server-side --force-conflicts \
                --field-manager=cilupbah-production \
                -f "$1" -n "$NAMESPACE"
            }

            apply_manifest_from_stdin() {
              kubectl apply --server-side --force-conflicts \
                --field-manager=cilupbah-production \
                -f - -n "$NAMESPACE"
            }

            # Expand schema with the NEW image before any new application or
            # worker can query it. Failure leaves the running release intact.
            DEPLOY_STAGE="database-migration"
            migration_job=$(kubectl create -f "$K8S_DIR/01-database-migration.yaml" \
              -n "$NAMESPACE" -o jsonpath='{.metadata.name}')
            if ! kubectl wait --for=condition=complete "job/$migration_job" \
              -n "$NAMESPACE" --timeout=930s; then
              kubectl logs "job/$migration_job" -n "$NAMESPACE" --all-containers --tail=150 || true
              echo "Migrasi gagal; rollout aplikasi dibatalkan."
              exit 1
            fi

            # Retire only the old CronJob. Keep the current Deployment alive
            # until its replacement is ready; it drives durable recovery work.
            kubectl delete cronjob cilupbah-scheduler -n "$NAMESPACE" \
              --cascade=foreground --wait=true --ignore-not-found

            # Legacy recovery queues were audited empty in production. Remove
            # the retired worker before applying the active manifests so an
            # old deployment cannot block rollout or return on a later deploy.
            kubectl delete deployment cilupbah-horizon-legacy-queue-recovery \
              -n "$NAMESPACE" --cascade=foreground --wait=false --ignore-not-found

            # These low-priority label queues are now served by the labels PDF
            # pool. Delete their old masters explicitly: removing a manifest
            # alone would leave idle PHP workers consuming memory forever.
            for retired_horizon in \
              cilupbah-horizon-labels-prefetch \
              cilupbah-horizon-labels-archive \
              cilupbah-horizon-order-recovery
            do
              kubectl delete deployment "$retired_horizon" \
                -n "$NAMESPACE" --cascade=foreground --wait=false --ignore-not-found
            done

            DEPLOY_STAGE="platform-manifests"
            echo "==> Mengaplikasikan pool queue yang terpisah ke Kubernetes..."
            for manifest in "$K8S_DIR"/*.yaml; do
              case "$(basename "$manifest")" in
                01-database-migration.yaml|01-gotenberg.yaml|02-app.yaml|03-*.yaml|04-horizon-labels-awb.yaml|04-horizon-labels.yaml|04-scheduler.yaml|08-keda-autoscaling.yaml) continue ;;
              esac
              apply_manifest "$manifest"
            done

            wait_for_terminating_pods() {
              deployment="$1"
              wait_timeout="$2"
              started_at="$(date +%s)"

              while true; do
                terminating_pods="$(
                  kubectl get pods -n "$NAMESPACE" \
                    -l "app=$deployment" -o json \
                    | jq -r '.items[] | select(.metadata.deletionTimestamp != null) | .metadata.name'
                )"

                if [ -z "$terminating_pods" ]; then
                  return 0
                fi

                elapsed=$(( $(date +%s) - started_at ))
                if [ "$elapsed" -ge "$wait_timeout" ]; then
                  echo "Pod lama deployment/$deployment belum melepaskan resource setelah ${wait_timeout}s:"
                  printf '%s\n' "$terminating_pods"
                  kubectl get pods -n "$NAMESPACE" -l "app=$deployment" -o wide || true
                  return 1
                fi

                echo "Menunggu pod lama deployment/$deployment melepaskan resource:"
                printf '%s\n' "$terminating_pods"
                sleep 5
              done
            }

            wait_for_all_terminating_pods() {
              wait_timeout="$1"
              started_at="$(date +%s)"

              while true; do
                terminating_pods="$(
                  kubectl get pods -n "$NAMESPACE" -o json \
                    | jq -r '.items[] | select(.metadata.deletionTimestamp != null) | .metadata.name'
                )"

                if [ -z "$terminating_pods" ]; then
                  return 0
                fi

                elapsed=$(( $(date +%s) - started_at ))
                if [ "$elapsed" -ge "$wait_timeout" ]; then
                  echo "Pod dari rollout sebelumnya belum melepaskan resource setelah ${wait_timeout}s:"
                  printf '%s\n' "$terminating_pods"
                  kubectl get pods -n "$NAMESPACE" -o wide || true
                  return 1
                fi

                echo "Menunggu sisa pod dari rollout sebelumnya melepaskan resource:"
                printf '%s\n' "$terminating_pods"
                sleep 5
              done
            }

            rollout_deployment() {
              deployment="$1"
              grace_period="$(kubectl get deployment "$deployment" -n "$NAMESPACE" \
                -o jsonpath='{.spec.template.spec.terminationGracePeriodSeconds}')"
              progress_deadline="$(kubectl get deployment "$deployment" -n "$NAMESPACE" \
                -o jsonpath='{.spec.progressDeadlineSeconds}')"

              case "$grace_period" in
                ''|*[!0-9]*) grace_period=180 ;;
              esac
              case "$progress_deadline" in
                ''|*[!0-9]*) progress_deadline=600 ;;
              esac

              # Wait for both Kubernetes' own progress deadline and the pod's
              # graceful termination window, plus a settling buffer. A fixed
              # 300s timeout can report a false failure while the rollout is
              # still converging (especially app startup and PVC workers).
              rollout_timeout=$((progress_deadline + 120))
              grace_timeout=$((grace_period + 180))
              if [ "$grace_timeout" -gt "$rollout_timeout" ]; then
                rollout_timeout="$grace_timeout"
              fi
              if [ "$rollout_timeout" -lt 300 ]; then
                rollout_timeout=300
              fi

              echo "Menunggu rollout deployment/$deployment (grace=${grace_period}s, progress-deadline=${progress_deadline}s, timeout=${rollout_timeout}s)..."
              if timeout "${rollout_timeout}s" kubectl rollout status \
                "deployment/$deployment" -n "$NAMESPACE" \
                --request-timeout=30s --timeout="${rollout_timeout}s"; then
                wait_for_terminating_pods "$deployment" "$grace_timeout"
                return 0
              fi

              # A timeout can race with the final readiness transition. Give
              # Kubernetes one short convergence window before collecting
              # diagnostics and failing the deployment.
              echo "Rollout deployment/$deployment belum selesai; menunggu konvergensi akhir 180s..."
              if timeout 180s kubectl rollout status \
                "deployment/$deployment" -n "$NAMESPACE" \
                --request-timeout=30s --timeout=180s; then
                wait_for_terminating_pods "$deployment" "$grace_timeout"
                echo "Rollout deployment/$deployment selesai pada retry konvergensi."
                return 0
              fi

              echo "Rollout deployment/$deployment gagal atau timeout; mengumpulkan diagnostik..."
              kubectl get deployment "$deployment" -n "$NAMESPACE" -o wide || true
              kubectl get pods -n "$NAMESPACE" -l "app=$deployment" -o wide || true
              kubectl describe deployment "$deployment" -n "$NAMESPACE" || true
              kubectl get events -n "$NAMESPACE" --sort-by='.lastTimestamp' | tail -n 40 || true

              for pod in $(kubectl get pods -n "$NAMESPACE" -l "app=$deployment" \
                -o name 2>/dev/null); do
                kubectl describe "$pod" -n "$NAMESPACE" || true
                kubectl logs "$pod" -n "$NAMESPACE" --all-containers \
                  --tail=120 --prefix 2>/dev/null || true
              done

              return 1
            }

            echo "==> Memverifikasi platform..."
            DEPLOY_STAGE="platform-rollout"
            for deployment in \
              cilupbah-pgbouncer \
              cilupbah-redis \
              cilupbah-redis-cache \
              cilupbah-redis-finance \
              cilupbah-redis-horizon \
              cilupbah-redis-long
            do
              if kubectl get deployment "$deployment" -n "$NAMESPACE" \
                --request-timeout=30s >/dev/null 2>&1; then
                rollout_deployment "$deployment"
              else
                echo "Deployment $deployment belum ada; dilewati."
              fi
            done

            deploy_workload() {
              manifest="$1"
              deployment="$2"
              DEPLOY_STAGE="workload:$deployment"
              "$DEPLOY_ROOT/scripts/kubernetes-capacity-preflight" "$NAMESPACE" 2048 90

              case "$deployment" in
                cilupbah-app|cilupbah-horizon*)
                  current_replicas="$(kubectl get deployment "$deployment" -n "$NAMESPACE" \
                    -o jsonpath='{.spec.replicas}' 2>/dev/null || true)"
                  case "$current_replicas" in
                    ''|*[!0-9]*)
                      apply_manifest "$K8S_DIR/$manifest"
                      ;;
                    *)
                      kubectl apply --dry-run=client -f "$K8S_DIR/$manifest" -o json \
                        | "$DEPLOY_ROOT/scripts/kubernetes-sanitize-manifest" \
                            "$deployment" "$current_replicas" \
                        | apply_manifest_from_stdin
                      ;;
                  esac
                  ;;
                *)
                  apply_manifest "$K8S_DIR/$manifest"
                  ;;
              esac

              rollout_deployment "$deployment"
            }

            DEPLOY_STAGE="keda-availability"
            if ! kubectl api-resources --api-group=keda.sh --no-headers 2>/dev/null \
              | grep -Eq '(^|[[:space:]])scaledobjects([[:space:]]|$)'; then
              echo "KEDA wajib tersedia untuk autoscaling produksi."
              exit 1
            fi

            apply_manifest "$K8S_DIR/08-keda-autoscaling.yaml"

            DEPLOY_STAGE="drain-previous-rollout"
            wait_for_all_terminating_pods 2040

            echo "==> Menjalankan rollout berurutan dengan capacity gate..."
            for workload in \
              "01-gotenberg.yaml:cilupbah-gotenberg" \
              "02-app.yaml:cilupbah-app" \
              "04-scheduler.yaml:cilupbah-scheduler" \
              "03-horizon-critical.yaml:cilupbah-horizon-critical" \
              "03-horizon-order-intake.yaml:cilupbah-horizon-order-intake" \
              "03-horizon-fulfillment.yaml:cilupbah-horizon-fulfillment" \
              "03-horizon-stock.yaml:cilupbah-horizon-stock" \
              "04-horizon-labels-awb.yaml:cilupbah-horizon-labels-awb" \
              "04-horizon-labels.yaml:cilupbah-horizon-labels" \
              "03-horizon.yaml:cilupbah-horizon" \
              "03-horizon-maintenance.yaml:cilupbah-horizon-maintenance" \
              "03-import-worker.yaml:cilupbah-import-worker" \
              "03-export-worker.yaml:cilupbah-export-worker" \
              "03-catalog-export-worker.yaml:cilupbah-catalog-export-worker" \
              "03-pdf-export-worker.yaml:cilupbah-pdf-export-worker"
            do
              manifest="${workload%%:*}"
              deployment="${workload#*:}"
              deploy_workload "$manifest" "$deployment"
            done

            for scaled_object in \
              cilupbah-horizon-background \
              cilupbah-horizon-maintenance \
              cilupbah-horizon-order-intake \
              cilupbah-horizon-fulfillment \
              cilupbah-horizon-stock \
              cilupbah-horizon-marketplace-ops \
              cilupbah-horizon-labels-awb \
              cilupbah-horizon-labels
            do
              kubectl wait --for=condition=Ready "scaledobject/$scaled_object" \
                -n "$NAMESPACE" --timeout=120s
            done

            DEPLOY_STAGE="final-convergence"
            wait_for_all_terminating_pods 2040

            for deployment in \
              cilupbah-app \
              cilupbah-scheduler \
              cilupbah-horizon-critical \
              cilupbah-horizon-order-intake \
              cilupbah-horizon-fulfillment \
              cilupbah-horizon-stock \
              cilupbah-horizon-labels-awb \
              cilupbah-horizon-labels \
              cilupbah-horizon \
              cilupbah-horizon-maintenance \
              cilupbah-import-worker \
              cilupbah-export-worker \
              cilupbah-catalog-export-worker \
              cilupbah-pdf-export-worker
            do
              rollout_deployment "$deployment"
            done

            DEPLOY_STAGE="final-image-verification"
            for deployment in \
              cilupbah-app \
              cilupbah-scheduler \
              cilupbah-horizon-critical \
              cilupbah-horizon-order-intake \
              cilupbah-horizon-fulfillment \
              cilupbah-horizon-stock \
              cilupbah-horizon-labels-awb \
              cilupbah-horizon-labels \
              cilupbah-horizon \
              cilupbah-horizon-maintenance \
              cilupbah-import-worker \
              cilupbah-export-worker \
              cilupbah-catalog-export-worker \
              cilupbah-pdf-export-worker
            do
              mismatched_images="$(
                kubectl get deployment "$deployment" -n "$NAMESPACE" -o json \
                  | jq -r --arg image "$IMAGE" '
                      [
                        .spec.template.spec.initContainers[]?,
                        .spec.template.spec.containers[]?
                      ]
                      | .[]
                      | select(.image | startswith("ghcr.io/ultra-teknologi-indonesia/cilupbah:"))
                      | select(.image != $image)
                      | .image
                    '
              )"

              if [ -n "$mismatched_images" ]; then
                echo "Deployment $deployment masih memakai image aplikasi yang berbeda dari $IMAGE:"
                printf '%s\n' "$mismatched_images"
                exit 1
              fi
            done

            DEPLOY_STAGE="final-capacity-verification"
            "$DEPLOY_ROOT/scripts/kubernetes-capacity-preflight" "$NAMESPACE" 0 90

            DEPLOY_STAGE="final-horizon-verification"
            for deployment in \
              cilupbah-horizon \
              cilupbah-horizon-critical \
              cilupbah-horizon-order-intake \
              cilupbah-horizon-fulfillment \
              cilupbah-horizon-stock \
              cilupbah-horizon-labels-awb \
              cilupbah-horizon-labels \
              cilupbah-horizon-maintenance
            do
              kubectl exec -n "$NAMESPACE" "deployment/$deployment" -- \
                php artisan horizon:status | grep -q running
            done

            echo "Production deployment success: $VERSION"
