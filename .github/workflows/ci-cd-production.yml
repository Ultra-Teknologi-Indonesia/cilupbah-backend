name: Production Deploy

permissions:
  contents: read
  packages: read

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Biarkan 'latest' = deploy versi terbaru otomatis. Isi vX.Y.Z (mis. v1.0.110) untuk rollback."
        required: true
        default: latest
        type: string

jobs:
  # ─────────────────────────────────────────────
  # Sanity check dulu SEBELUM nyentuh production:
  # - format versi harus vX.Y.Z (hindari typo)
  # - image dengan tag itu harus benar-benar ada di GHCR
  # ─────────────────────────────────────────────
  validate-input:
    name: Validate Version Input
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Checkout (untuk baca git tag saat resolve 'latest')
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve versi
        id: resolve
        run: |
          V="${{ inputs.version }}"
          if [ "$V" = "latest" ]; then
            V=$(git tag -l 'v*' --sort=-v:refname | head -n1)
            if [ -z "$V" ]; then
              echo "Tak ada tag vX.Y.Z di repo."; exit 1
            fi
            echo "'latest' → $V"
          fi
          if [[ ! "$V" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Versi tidak valid: $V"; exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Login GHCR (read-only)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Cek image ada di GHCR
        run: |
          docker manifest inspect ghcr.io/ultra-teknologi-indonesia/cilupbah:${{ steps.resolve.outputs.version }} > /dev/null
          echo "Image ${{ steps.resolve.outputs.version }} ditemukan di GHCR, lanjut deploy."

  # ─────────────────────────────────────────────
  # Job ini pakai `environment: production`.
  # WAJIB dibuat dulu manual di:
  # Settings > Environments > New environment > "production"
  # -> centang "Required reviewers", tambahkan reviewer
  # Kalau environment ini belum dibuat, job akan tetap jalan
  # TANPA approval gate (jadi jangan lupa setup-nya).
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    needs: validate-input
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Salin file K8s ke server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_DEPLOY_SERVER }}
          username: ${{ secrets.PROD_DEPLOY_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          source: "k8s/production/*"
          target: "/tmp/cilupbah-k8s"

      - name: Deploy via SSH ke server production
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PROD_DEPLOY_SERVER }}
          username: ${{ secrets.PROD_DEPLOY_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          timeout: 20m
          command_timeout: 20m
          script: |
            set -e

            VERSION="${{ needs.validate-input.outputs.version }}"
            IMAGE="ghcr.io/ultra-teknologi-indonesia/cilupbah:${VERSION}"

            echo "Deploying $IMAGE ke production..."
            NAMESPACE="cilupbah"
            K8S_DIR="/tmp/cilupbah-k8s/k8s/production"

            cleanup() {
              rm -rf "$K8S_DIR"
            }
            trap cleanup EXIT

            echo "==> Mengupdate image tag di file YAML temporary..."
            sed -i "s|image: ghcr.io/ultra-teknologi-indonesia/cilupbah:.*|image: $IMAGE|g" "$K8S_DIR"/*.yaml

            # Hapus bentuk scheduler lama apa pun sebelum menerapkan manifest
            # baru; Kubernetes tidak mengubah kind CronJob <-> Deployment.
            kubectl delete deployment cilupbah-scheduler -n "$NAMESPACE" --ignore-not-found
            kubectl delete cronjob cilupbah-scheduler -n "$NAMESPACE" \
              --cascade=foreground --wait=true --ignore-not-found

            echo "==> Menjeda profil Horizon critical sebelum rollout..."
            # The old Horizon deployment may still be running with the legacy
            # all-supervisor profile. Stop the new critical pool first so two
            # masters cannot consume the same side-effecting queues during the
            # profile migration. Redis keeps pending jobs durable.
            if kubectl get deployment/cilupbah-horizon-critical -n "$NAMESPACE" >/dev/null 2>&1; then
              kubectl scale deployment/cilupbah-horizon-critical \
                --replicas=0 -n "$NAMESPACE"
            else
              echo "Profil Horizon critical belum ada; lanjutkan bootstrap deployment."
            fi

            echo "==> Mengaplikasikan konfigurasi non-critical ke Kubernetes..."
            for manifest in "$K8S_DIR"/*.yaml; do
              if [ "$(basename "$manifest")" = "03-horizon-critical.yaml" ]; then
                continue
              fi
              kubectl apply -f "$manifest" -n "$NAMESPACE"
            done

            echo "==> Menunggu Horizon background berpindah profil..."
            kubectl rollout status deployment/cilupbah-horizon -n "$NAMESPACE" --timeout=300s

            echo "==> Mengaktifkan profil Horizon critical..."
            kubectl apply -f "$K8S_DIR/03-horizon-critical.yaml" -n "$NAMESPACE"

            rollout_deployment() {
              deployment="$1"
              grace_period="$(kubectl get deployment "$deployment" -n "$NAMESPACE" \
                -o jsonpath='{.spec.template.spec.terminationGracePeriodSeconds}')"

              case "$grace_period" in
                ''|*[!0-9]*) grace_period=180 ;;
              esac

              # Recreate deployments first terminate the old pod. Leave a
              # fixed 180s startup/settling headroom after the grace period.
              # A fixed 300s timeout is unsafe for the 300s legacy recovery
              # pod and for label pods that initialize the shared PVC.
              rollout_timeout=$((grace_period + 180))
              if [ "$rollout_timeout" -lt 300 ]; then
                rollout_timeout=300
              fi

              echo "Menunggu rollout deployment/$deployment (grace=${grace_period}s, timeout=${rollout_timeout}s)..."
              if kubectl rollout status "deployment/$deployment" -n "$NAMESPACE" \
                --timeout="${rollout_timeout}s"; then
                return 0
              fi

              echo "Rollout deployment/$deployment gagal atau timeout; mengumpulkan diagnostik..."
              kubectl get deployment "$deployment" -n "$NAMESPACE" -o wide || true
              kubectl get pods -n "$NAMESPACE" -l "app=$deployment" -o wide || true
              kubectl describe deployment "$deployment" -n "$NAMESPACE" || true
              kubectl get events -n "$NAMESPACE" --sort-by='.lastTimestamp' | tail -n 40 || true

              for pod in $(kubectl get pods -n "$NAMESPACE" -l "app=$deployment" \
                -o name 2>/dev/null); do
                kubectl describe "$pod" -n "$NAMESPACE" || true
                kubectl logs "$pod" -n "$NAMESPACE" --all-containers \
                  --tail=120 --prefix 2>/dev/null || true
              done

              return 1
            }

            echo "==> Menunggu rollout aplikasi dan layanan kritis..."
            DEPLOYMENTS="$(kubectl get -f "$K8S_DIR" -n "$NAMESPACE" -o name | sed -n 's#^deployment.apps/##p')"
            if [ -z "$DEPLOYMENTS" ]; then
              echo "Tidak ada Deployment yang ditemukan dari manifest production."
              exit 1
            fi

            for deployment in $DEPLOYMENTS; do
              case "$deployment" in
                cilupbah-import-worker|cilupbah-export-worker|cilupbah-catalog-export-worker|cilupbah-pdf-export-worker)
                  continue
                  ;;
              esac

              rollout_deployment "$deployment"
            done

            echo "==> Memulai rollout worker berat secara asynchronous (graceful drain)..."
            for deployment in \
              cilupbah-import-worker \
              cilupbah-export-worker \
              cilupbah-catalog-export-worker \
              cilupbah-pdf-export-worker
            do
              if ! kubectl get deployment "$deployment" -n "$NAMESPACE" >/dev/null 2>&1; then
                echo "Worker $deployment tidak ada; dilewati."
                continue
              fi

              # Recreate + terminationGracePeriodSeconds intentionally keeps
              # one heavy worker per queue and lets its current job drain.
              # Do only a short health check here; waiting for the full drain
              # would make every deploy take up to 31 minutes.
              if kubectl rollout status "deployment/$deployment" -n "$NAMESPACE" --timeout=20s; then
                echo "Worker $deployment sudah siap."
              else
                echo "Worker $deployment masih graceful-draining; rollout dilanjutkan oleh Kubernetes."
                kubectl get deployment "$deployment" -n "$NAMESPACE" \
                  -o custom-columns='NAME:.metadata.name,READY:.status.readyReplicas,UPDATED:.status.updatedReplicas,AVAILABLE:.status.availableReplicas,UNAVAILABLE:.status.unavailableReplicas' \
                  --no-headers || true
              fi
            done

            # Migrasi DB: explicit gated deploy step (sesuai catatan di start.production.sh).
            # Dijalankan dari pod app yang sudah ter-rollout (punya file migrasi versi baru).
            # Migrasi fitur ini additive (kolom nullable + tabel baru) → aman.
            echo "==> Menjalankan migrasi database..."
            kubectl exec deploy/cilupbah-app -n $NAMESPACE -- php artisan migrate --force

            echo "Production deployment success: $VERSION"
