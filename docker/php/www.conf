; =======================================================================
; PHP-FPM Pool Configuration — Production Hardening
; =======================================================================
; Menggantikan default pool (pm.max_children = 5) yang menyebabkan
; bottleneck di production: 5 worker habis → liveness probe timeout
; → CrashLoopBackOff → 502.
;
; RAM budget per pod: 20 worker × ~35 MB = ~700 MB (dalam limit 1.5 Gi)
; =======================================================================

[www]
user = www-data
group = www-data

listen = 127.0.0.1:9000

; Dynamic: child di-spawn/despawn sesuai beban.
pm = dynamic

; Hard cap: tidak pernah lebih dari 20 child sekaligus.
; 20 × 35 MB ≈ 700 MB, masih dalam container limit 1.5 Gi.
pm.max_children = 20

; Saat FPM boot, langsung siapkan 5 worker agar request pertama
; tidak menunggu spawn.
pm.start_servers = 5

; Minimal 3 worker idle siaga untuk lonjakan mendadak.
pm.min_spare_servers = 3

; Maksimal 10 worker idle — lebih dari ini di-despawn untuk hemat RAM.
pm.max_spare_servers = 10

; Setiap worker di-recycle setelah melayani 500 request.
; Mencegah memory leak gradual dari library PHP.
pm.max_requests = 500

; Worker yang idle >10 detik di-kill (di atas min_spare_servers).
pm.process_idle_timeout = 10s
