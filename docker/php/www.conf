; =======================================================================
; PHP-FPM Pool Configuration — Production Hardening
; =======================================================================
; Menggantikan default pool (pm.max_children = 5) yang menyebabkan
; bottleneck di production: 5 worker habis → liveness probe timeout
; → CrashLoopBackOff → 502.
;
; RAM budget per pod: 10 worker × ~35 MB = ~350 MB. Ini juga membatasi jumlah
; koneksi PostgreSQL simultan dari dua pod API.
; =======================================================================

[www]
user = www-data
group = www-data

listen = 127.0.0.1:9000

; Dynamic: child di-spawn/despawn sesuai beban.
pm = dynamic

; Hard cap: tidak pernah lebih dari 10 child sekaligus.
; Dengan dua pod API, batas teoretis FPM menjadi 20 koneksi simultan.
pm.max_children = 10

; Saat FPM boot, langsung siapkan 3 worker agar request pertama
; tidak menunggu spawn.
pm.start_servers = 3

; Minimal 2 worker idle siaga untuk lonjakan mendadak.
pm.min_spare_servers = 2

; Maksimal 5 worker idle — lebih dari ini di-despawn untuk hemat RAM.
pm.max_spare_servers = 5

; Setiap worker di-recycle setelah melayani 500 request.
; Mencegah memory leak gradual dari library PHP.
pm.max_requests = 500

; Worker yang idle >10 detik di-kill (di atas min_spare_servers).
pm.process_idle_timeout = 10s
