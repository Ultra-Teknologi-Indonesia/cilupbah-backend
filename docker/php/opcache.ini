; Opcache menyimpan hasil kompilasi PHP di memori. Ekstensinya sudah terpasang
; di image sejak awal, tapi tidak pernah dikonfigurasi — sehingga setiap request
; mengompilasi ulang seluruh berkas aplikasi.
opcache.enable=1

; WAJIB untuk setup ini. Entrypoint memakai `php artisan serve`, yang berjalan
; di SAPI CLI, dan pada CLI opcache mati secara bawaan meski opcache.enable=1.
; Tanpa baris ini, konfigurasi di atas tidak berpengaruh sama sekali.
opcache.enable_cli=1

; Aplikasi ini besar (ratusan berkas di app/ dan Modules/). Kalau memori atau
; kuota berkas kurang, opcache mulai membuang cache dan manfaatnya hilang.
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000

; Kode di dalam image tidak pernah berubah saat container hidup — deploy selalu
; lewat image baru. Jadi pemeriksaan perubahan berkas di tiap request hanya
; membuang I/O. Ini aman di sini karena kode TIDAK di-mount sebagai volume
; (yang di-mount hanya .env, storage, dan bootstrap/cache).
opcache.validate_timestamps=0

; Laravel dan sejumlah paket membaca komentar lewat reflection. Membuangnya
; menghemat sedikit memori tapi berisiko memecahkan hal-hal itu.
opcache.save_comments=1
